<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-i18n="アクセスが制限されています | SK">アクセスが制限されています | SK</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <!-- 表示（ライト・ダーク・テーマカラー）。ちらつかないよう、CSS より先に <html> に付ける（選ぶのはサイトのヘッダーのアカウントのメニューの「表示」。assets/site.js） -->
  <script>(function(){try{var t=JSON.parse(localStorage.getItem("sk_theme")||"{}"),d=document.documentElement;if(t.mode==="light"||t.mode==="dark")d.setAttribute("data-theme",t.mode);if(/^[a-z]{2,12}$/.test(t.accent||"")&&t.accent!=="blue")d.setAttribute("data-accent",t.accent);}catch(e){}})();</script>
  <script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"></script>
  <link rel="stylesheet" href="/assets/site.css">
  <!-- 選んだ言語で表示する（assets/i18n.js。body の最後で translatePage()） -->
  <script src="/assets/i18n.js"></script>
</head>
<body class="solo-page">
  <main class="solo">
    <div class="card">
      <a class="logo" href="/" aria-label="SK ホーム" data-i18n-aria="SK ホーム"><img src="/assets/logo.svg" alt="" width="48" height="48"></a>
      <h1 data-i18n="アクセスが制限されています">アクセスが制限されています</h1>
      <p data-i18n="このブラウザからのアクセスは、利用規約にもとづき制限されています。心当たりがない場合は、下のサポートIDを添えてお問い合わせください。">このブラウザからのアクセスは、利用規約にもとづき制限されています。心当たりがない場合は、下のサポートIDを添えてお問い合わせください。</p>
      <div class="id-box" style="text-align:left">
        <code data-support-id>読み込み中…</code>
        <button class="btn btn-tonal" type="button" data-copy-id hidden data-i18n="コピー">コピー</button>
      </div>
      <div class="btn-row">
        <a class="btn btn-tonal" href="/policies/" data-i18n="利用規約">利用規約</a>
        <a class="btn btn-ink" href="https://support.sk-hub.jp/contact/" data-i18n="お問い合わせ">お問い合わせ</a>
      </div>
    </div>
  </main>
  <script>window.SKI18N && SKI18N.translatePage();</script>
  <script src="/assets/site.js" defer></script>
</body>
</html>
