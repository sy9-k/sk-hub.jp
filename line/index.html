<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f7fb">
<title>アカウントセンター | SK Hub</title>
<!-- LINE の中の SK Hub アカウントセンター（LIFF。LINE ログインのチャネル「SK Hub Systems」の LIFF アプリ 2012009401-6XZgXLIL）
     お知らせ・LINE での受け取り・連携の状態を、ブラウザに移らずに見る。中身は /line/center.js -->
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=M+PLUS+1:wght@400;500;700;800&display=swap" data-icons="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block"></script>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --line: #e6e8ef; --text: #1b1d24; --sub: #5d6270; --muted: #8a8f9c;
    --primary: #2563eb; --primary-ink: #ffffff; --primary-soft: #e8efff; --line-green: #06c755; --danger: #c62828;
    --font: "M PLUS 1", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111318; --card: #1b1e25; --line: #2a2e38; --text: #e6e8ef; --sub: #a9aebb; --muted: #7d8290;
      --primary: #8fb0ff; --primary-ink: #0b1d4a; --primary-soft: #1d2a4a; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.7 var(--font); -webkit-font-smoothing: antialiased; }
  .msr { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; font-size: 22px; line-height: 1; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-feature-settings: "liga"; font-feature-settings: "liga"; font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
  main { max-width: 560px; margin: 0 auto; padding: max(16px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; gap: 10px; margin: 4px 4px 18px; }
  .top img { width: 28px; height: 28px; border-radius: 8px; }
  .top b { font-size: 17px; font-weight: 800; }
  .top span { color: var(--muted); font-size: 13px; margin-left: auto; }
  .card { background: var(--card); border-radius: 24px; padding: 18px; margin: 0 0 14px; }
  .h { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 15px; font-weight: 800; }
  .h .msr { color: var(--primary); }
  .h .count { margin-left: auto; background: #cc4900; color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 9px; font-weight: 700; }
  .me { display: flex; align-items: center; gap: 14px; }
  .av { width: 56px; height: 56px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; flex: none; overflow: hidden; }
  .av img { width: 100%; height: 100%; object-fit: cover; }
  .me b { display: block; font-size: 18px; font-weight: 800; line-height: 1.3; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: #067a37; background: #e3f7ea; border-radius: 999px; padding: 2px 10px; margin-top: 4px; }
  .chip .msr { font-size: 16px; }
  .text { color: var(--sub); font-size: 14px; margin: 0 0 12px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 48px; border: 0; border-radius: 999px; font: 700 15px var(--font); cursor: pointer; text-decoration: none; margin-top: 8px; }
  .btn--primary { background: var(--primary); color: var(--primary-ink); }
  .btn--line { background: var(--line-green); color: #fff; }
  .btn--tonal { background: var(--primary-soft); color: var(--primary); }
  .btn:disabled { opacity: .5; }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 2px; border-top: 1px solid var(--line); color: inherit; text-decoration: none; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; font: inherit; text-align: left; cursor: pointer; }
  .row:first-of-type { border-top: 0; }
  .row .ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; }
  .row .ic .msr { font-size: 22px; }
  .row .lb { flex: 1; min-width: 0; }
  .row .lb b { display: block; font-weight: 700; font-size: 15px; }
  .row .lb small { display: block; color: var(--sub); font-size: 12.5px; line-height: 1.5; }
  .row .go { color: var(--muted); }
  .sw { appearance: none; -webkit-appearance: none; width: 52px; height: 32px; border-radius: 999px; background: var(--line); position: relative; flex: none; cursor: pointer; transition: background .2s; margin: 0; }
  .sw::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .sw:checked { background: var(--line-green); }
  .sw:checked::after { transform: translateX(20px); }
  .nt { border-top: 1px solid var(--line); padding: 12px 2px; }
  .nt:first-of-type { border-top: 0; }
  .nt button { all: unset; display: block; width: 100%; cursor: pointer; }
  .nt b { font-weight: 700; display: flex; align-items: center; gap: 6px; }
  .nt b i { width: 8px; height: 8px; border-radius: 50%; background: #cc4900; flex: none; }
  .nt time { color: var(--muted); font-size: 12px; }
  .nt p { white-space: pre-wrap; word-break: break-word; margin: 8px 0 0; font-size: 14px; color: var(--sub); background: var(--bg); border-radius: 14px; padding: 12px; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 14px 0 4px; }
  .center { text-align: center; padding: 48px 8px; color: var(--sub); }
  .center > .msr { font-size: 44px; color: var(--primary); }
  .center h1 { font-size: 20px; font-weight: 800; color: var(--text); margin: 10px 0 6px; }
  .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
  .foot a { color: inherit; }
  .toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2e3036; color: #fff; padding: 10px 18px; border-radius: 12px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.on { opacity: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <main>
    <div class="top"><img src="/assets/favicon.svg" alt=""><b>アカウントセンター</b><span>SK Hub</span></div>
    <div id="app"><div class="center"><span class="msr" aria-hidden="true">progress_activity</span><p>読み込んでいます…</p></div></div>
    <p class="foot"><a href="/policies/">利用規約・プライバシーポリシー</a></p>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script type="module" src="/line/center.js"></script>
</body>
</html>
