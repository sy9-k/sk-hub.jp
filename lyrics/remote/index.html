<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* =====================================================================
     色・形（日本風 = 既定 / 韓国風 = data-ui="kr"）
     ===================================================================== */
  :root {
    --font: "M PLUS Rounded 1c", "Noto Sans JP", "Noto Sans KR", sans-serif;
    --bg: radial-gradient(120% 80% at 80% 0%, #4a1a6e 0%, #1c0d36 45%, #0d0820 100%);
    --bar: linear-gradient(#2a1650, #1a0d34);
    --field: #fff; --field-fg: #1a1030;
    --tile-r: linear-gradient(#ff5a5f, #d81f2c 55%, #b0121e);
    --tile-o: linear-gradient(#ffb43a, #f58a0c 55%, #d96a00);
    --tile-b: linear-gradient(#5d9bff, #2c66e8 55%, #1a46b8);
    --tile-g: linear-gradient(#3fd6c0, #13a892 55%, #0b7e6e);
    --tile-v: linear-gradient(#b980ff, #8a4ae8 55%, #6428c0);
    --tile-radius: 12px;
    --tile-edge: 0 0 0 2px rgba(255, 255, 255, .7), 0 4px 0 rgba(0, 0, 0, .35), 0 8px 18px rgba(0, 0, 0, .35);
    --row: linear-gradient(90deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .04));
    --row-edge: rgba(255, 255, 255, .14);
    --accent: #ffd23f;
    --reserve: radial-gradient(circle at 40% 30%, #ff8a8a 0%, #e8222f 45%, #a10f19 100%);
    --back: linear-gradient(#5fe08a, #1fae55);
    --pad-bg: radial-gradient(120% 90% at 50% 0%, #a3162a 0%, #5a0a18 55%, #2a0610 100%);
    --key: linear-gradient(#ffffff, #e4e4ee);
    --key-fg: #222;
  }
  [data-ui="kr"] {
    --font: "Noto Sans KR", "Noto Sans JP", sans-serif;
    --bg: radial-gradient(120% 80% at 20% 0%, #10204e 0%, #090b22 55%, #05060f 100%);
    --bar: linear-gradient(#0e1438, #090c24);
    --field: rgba(255, 255, 255, .08); --field-fg: #fff;
    --tile-r: linear-gradient(160deg, rgba(255, 63, 164, .28), rgba(255, 63, 164, .08));
    --tile-o: linear-gradient(160deg, rgba(255, 225, 77, .26), rgba(255, 225, 77, .06));
    --tile-b: linear-gradient(160deg, rgba(45, 226, 255, .26), rgba(45, 226, 255, .06));
    --tile-g: linear-gradient(160deg, rgba(80, 255, 160, .24), rgba(80, 255, 160, .06));
    --tile-v: linear-gradient(160deg, rgba(139, 92, 255, .32), rgba(139, 92, 255, .08));
    --tile-radius: 18px;
    --tile-edge: inset 0 0 0 1.5px rgba(255, 255, 255, .16);
    --row: rgba(255, 255, 255, .05);
    --row-edge: rgba(45, 226, 255, .18);
    --accent: #2de2ff;
    --reserve: radial-gradient(circle at 40% 30%, #fff4a8 0%, #ffd400 45%, #d18a00 100%);
    --back: linear-gradient(#2a3366, #1a2050);
    --pad-bg: radial-gradient(120% 90% at 50% 0%, #1a1f4a 0%, #0b0d24 60%, #05060f 100%);
    --key: radial-gradient(circle at 50% 35%, #2a3170, #151a42);
    --key-fg: #e6f7ff;
  }
  body { font-family: var(--font); background: var(--bg); }

  /* ================= 画面の枠 ================= */
  .shell { height: 100%; display: grid; grid-template-rows: auto 1fr auto; }
  .bar {
    display: flex; align-items: center; gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) 10px 8px; background: var(--bar);
    border-bottom: 1px solid rgba(255, 255, 255, .08);
  }
  .topbtn {
    flex: none; height: 38px; padding: 0 12px; border-radius: 10px; font-weight: 800; font-size: 14px;
    background: linear-gradient(#ffe46a, #f2b400); color: #3a2400; box-shadow: 0 2px 0 #9a6a00;
    display: flex; align-items: center; gap: 4px;
  }
  .crumb {
    flex: 1; min-width: 0; height: 38px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center;
    background: var(--field); color: var(--field-fg); font-weight: 800; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .uiswitch { flex: none; display: flex; border-radius: 10px; overflow: hidden; border: 1.5px solid rgba(255, 255, 255, .3); font-size: 12px; font-weight: 800; }
  .uiswitch button { padding: 0 10px; height: 35px; color: rgba(255, 255, 255, .6); }
  .uiswitch button[aria-pressed="true"] { background: #fff; color: #1a1030; }
  [data-ui="kr"] .topbtn { background: linear-gradient(135deg, #ff3fa4, #8b5cff); color: #fff; box-shadow: 0 0 14px rgba(255, 63, 164, .45); }
  [data-ui="kr"] .crumb { border: 1.5px solid rgba(45, 226, 255, .4); box-shadow: 0 0 14px rgba(45, 226, 255, .15); }

  #views { position: relative; overflow: hidden; }
  .view { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px 20px; animation: vin .28s cubic-bezier(.2, .8, .2, 1); }
  @keyframes vin { from { opacity: 0; transform: translateX(12px); } }

  .foot {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 8px; align-items: center;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid rgba(255, 255, 255, .08);
  }
  .backbtn {
    height: 40px; padding: 0 14px 0 8px; border-radius: 999px; background: var(--back); font-weight: 800; font-size: 14px;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 2px 0 rgba(0, 0, 0, .35);
  }
  .backbtn i { width: 24px; height: 24px; border-radius: 50%; background: rgba(255, 255, 255, .9); color: #1a8a45; display: grid; place-items: center; font-style: normal; font-weight: 900; }
  [data-ui="kr"] .backbtn i { color: #1a2050; }
  .mini { display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; }
  .mini img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; background: rgba(255, 255, 255, .1); flex: none; }
  .mini .lb { font-size: 10px; font-weight: 800; color: var(--accent); }
  .mini .tt { font-size: 13px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .footbtn { height: 40px; padding: 0 12px; border-radius: 10px; font-size: 13px; font-weight: 800; background: rgba(255, 255, 255, .12); }
  .footbtn.stop { background: linear-gradient(#ff5a5f, #c4141f); box-shadow: 0 2px 0 #7a0a12; }
  [data-ui="kr"] .footbtn.stop { background: linear-gradient(#ff4a6a, #b0103a); }

  /* ================= TOP ================= */
  .home { display: grid; gap: 12px; grid-template-columns: 1fr; max-width: 1100px; margin: 0 auto; }
  @media (min-width: 820px) { .home { grid-template-columns: minmax(280px, 38%) 1fr; } }
  .nowcard {
    border-radius: 14px; padding: 12px; background: rgba(0, 0, 0, .35); border: 1.5px solid rgba(255, 255, 255, .14);
    display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: center;
  }
  @media (min-width: 820px) { .nowcard { grid-template-columns: 1fr; align-content: start; } .nowcard img { width: 100%; height: auto; aspect-ratio: 1; } }
  .nowcard img { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: rgba(255, 255, 255, .08); box-shadow: 0 6px 18px rgba(0, 0, 0, .4); }
  .nowcard .lb { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; background: var(--accent); color: #2a1a00; }
  [data-ui="kr"] .nowcard .lb { color: #04202a; }
  .nowcard .tt { margin-top: 6px; font-size: 18px; font-weight: 900; line-height: 1.3; }
  .nowcard .aa { font-size: 13px; color: rgba(255, 255, 255, .7); margin-top: 2px; }
  .nowcard .bar2 { height: 5px; border-radius: 3px; background: rgba(255, 255, 255, .15); margin-top: 10px; overflow: hidden; }
  .nowcard .bar2 i { display: block; height: 100%; width: 0; background: var(--accent); }
  .install { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .install button { padding: 8px 12px; border-radius: 10px; background: rgba(255, 255, 255, .12); font-size: 12px; font-weight: 800; }
  .install p { margin: 0; font-size: 11px; color: rgba(255, 255, 255, .6); line-height: 1.6; }

  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; align-content: start; }
  @media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile {
    position: relative; overflow: hidden; min-height: 86px; padding: 10px 8px; border-radius: var(--tile-radius);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center;
    font-weight: 900; font-size: 16px; line-height: 1.2; box-shadow: var(--tile-edge);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
  }
  .tile.big { grid-column: span 1; min-height: 112px; font-size: 20px; }
  .tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 48%; background: linear-gradient(rgba(255, 255, 255, .32), rgba(255, 255, 255, .06)); pointer-events: none; }
  .tile:active { transform: translateY(2px); filter: brightness(1.08); }
  .tile svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .tile .sub { font-size: 10px; font-weight: 700; opacity: .75; text-shadow: none; }
  .t-r { background: var(--tile-r); } .t-o { background: var(--tile-o); } .t-b { background: var(--tile-b); } .t-g { background: var(--tile-g); } .t-v { background: var(--tile-v); }
  [data-ui="kr"] .tile::before { display: none; }
  [data-ui="kr"] .tile { text-shadow: 0 0 12px currentColor; }
  [data-ui="kr"] .t-r { color: #ff7cc4; box-shadow: inset 0 0 0 1.5px rgba(255, 63, 164, .7), 0 0 18px rgba(255, 63, 164, .25); }
  [data-ui="kr"] .t-o { color: #ffe97a; box-shadow: inset 0 0 0 1.5px rgba(255, 225, 77, .65), 0 0 18px rgba(255, 225, 77, .2); }
  [data-ui="kr"] .t-b { color: #7aefff; box-shadow: inset 0 0 0 1.5px rgba(45, 226, 255, .65), 0 0 18px rgba(45, 226, 255, .22); }
  [data-ui="kr"] .t-g { color: #8dffc2; box-shadow: inset 0 0 0 1.5px rgba(80, 255, 160, .6), 0 0 18px rgba(80, 255, 160, .2); }
  [data-ui="kr"] .t-v { color: #c4abff; box-shadow: inset 0 0 0 1.5px rgba(139, 92, 255, .7), 0 0 18px rgba(139, 92, 255, .25); }
  [data-ui="kr"] .tile .sub { color: rgba(255, 255, 255, .7); }
  .sub:empty { display: none; }

  /* ================= 探す ================= */
  .find { max-width: 1100px; margin: 0 auto; }
  @media (min-width: 900px) { .find { display: grid; grid-template-columns: 400px 1fr; gap: 16px; align-items: start; } .find .left { position: sticky; top: 0; } }
  .modes { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .modes button { padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 800; background: rgba(255, 255, 255, .1); }
  .modes button[aria-pressed="true"] { background: var(--tile-r); box-shadow: 0 0 0 2px rgba(255, 255, 255, .6); }
  [data-ui="kr"] .modes button[aria-pressed="true"] { background: transparent; box-shadow: inset 0 0 0 1.5px #ff3fa4, 0 0 12px rgba(255, 63, 164, .4); color: #ff9bd2; }
  .sbox { display: flex; gap: 6px; }
  .sbox .f { flex: 1; position: relative; }
  #q { width: 100%; height: 48px; padding: 0 40px 0 14px; border-radius: 10px; border: 0; font: inherit; font-size: 17px; font-weight: 700; color: var(--field-fg); background: var(--field); outline: none; }
  [data-ui="kr"] #q { border: 1.5px solid rgba(45, 226, 255, .45); }
  #qclear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; color: #888; font-size: 18px; }
  #kanaBtn { height: 48px; padding: 0 12px; border-radius: 10px; font-weight: 800; font-size: 13px; background: rgba(255, 255, 255, .12); }
  #kanaBtn[aria-pressed="true"] { background: var(--tile-b); }
  [data-ui="kr"] #kanaBtn { display: none; }
  #kana { margin-top: 8px; padding: 8px; border-radius: 12px; background: rgba(0, 0, 0, .3); }
  .kgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; direction: rtl; }
  .kgrid button, .krow button { height: 42px; border-radius: 8px; background: var(--key); color: var(--key-fg); font-weight: 800; font-size: 17px; direction: ltr; box-shadow: 0 2px 0 rgba(0, 0, 0, .35); }
  .kgrid .blank { visibility: hidden; }
  .krow { display: grid; grid-template-columns: repeat(4, 1fr) 1.4fr 1.4fr 1.4fr; gap: 4px; margin-top: 4px; }
  .krow .fn { font-size: 12px; }
  .krow .del { background: linear-gradient(#ffd0d4, #f2a3aa); }
  .hint { margin: 8px 2px; font-size: 12px; color: rgba(255, 255, 255, .55); line-height: 1.6; }

  /* ================= 一覧 ================= */
  .lhead { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 2px 8px; }
  .lhead b { font-size: 15px; }
  .lhead span { font-size: 12px; color: rgba(255, 255, 255, .6); }
  .tabs2 { display: flex; gap: 4px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; }
  .tabs2 button { flex: none; padding: 8px 12px; border-radius: 8px 8px 0 0; font-size: 13px; font-weight: 800; background: rgba(255, 255, 255, .08); color: rgba(255, 255, 255, .7); }
  .tabs2 button[aria-pressed="true"] { background: var(--tile-v); color: #fff; }
  .row {
    display: grid; grid-template-columns: 26px minmax(0, 1.3fr) minmax(0, 1fr) auto; align-items: center; gap: 10px;
    min-height: 54px; padding: 6px 8px 6px 10px; margin-bottom: 4px; border-radius: 8px; background: var(--row);
    border: 1px solid var(--row-edge); text-align: left; width: 100%;
    animation: rin .25s ease both;
  }
  @keyframes rin { from { opacity: 0; transform: translateY(4px); } }
  .row .ic { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: rgba(255, 255, 255, .12); font-size: 14px; }
  .row .t { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .a { font-size: 13px; color: rgba(255, 255, 255, .78); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
  .row .a::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 4px; background: linear-gradient(#b980ff, #7a3ae0); }
  [data-ui="kr"] .row .a::before { background: linear-gradient(#2de2ff, #1a8ad8); }
  .row .no { display: block; font-size: 11px; color: rgba(255, 255, 255, .5); font-variant-numeric: tabular-nums; margin-top: 2px; }
  .row.cur { border-color: var(--accent); }
  .row .tag { display: inline-block; margin-right: 5px; padding: 1px 6px; border-radius: 5px; font-size: 10px; background: var(--accent); color: #1a1000; vertical-align: 2px; }
  .rsv { width: 46px; height: 46px; border-radius: 50%; background: var(--reserve); font-weight: 900; font-size: 13px; box-shadow: 0 3px 0 rgba(0, 0, 0, .4), inset 0 2px 0 rgba(255, 255, 255, .35); text-shadow: 0 1px 0 rgba(0, 0, 0, .3); }
  [data-ui="kr"] .rsv { color: #3a2400; text-shadow: none; }
  .rsv.done { background: radial-gradient(circle at 40% 30%, #9cffc4, #20c46a 50%, #0d7a3e); color: #fff; }
  @media (max-width: 560px) {
    .row { grid-template-columns: 26px minmax(0, 1fr) auto; }
    .row .a.wide { display: none; }
    .row .a.narrow { display: flex; }
  }
  .row .a.narrow { display: none; }
  .empty { padding: 36px 10px; text-align: center; color: rgba(255, 255, 255, .6); font-size: 14px; line-height: 1.8; }
  .more { width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; background: rgba(255, 255, 255, .08); font-weight: 800; color: rgba(255, 255, 255, .75); }

  /* ================= リモコン（番号で予約・操作） ================= */
  #v-pad { background: var(--pad-bg); }
  .pad { max-width: 980px; margin: 0 auto; display: grid; gap: 14px; }
  @media (min-width: 760px) { .pad { grid-template-columns: 1fr 1fr; align-items: start; } }
  .padbox { padding: 12px; border-radius: 16px; background: rgba(0, 0, 0, .3); border: 1.5px solid rgba(255, 255, 255, .15); }
  .disp {
    display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 14px; border-radius: 10px; margin-bottom: 10px;
    background: #0a0a14; border: 2px solid rgba(255, 255, 255, .25); font-variant-numeric: tabular-nums;
  }
  .disp small { font-size: 11px; color: rgba(255, 255, 255, .6); font-weight: 800; }
  .disp b { flex: 1; text-align: right; font-size: 34px; letter-spacing: .08em; color: var(--accent); font-family: ui-monospace, "SF Mono", Menlo, monospace; text-shadow: 0 0 10px currentColor; }
  .disp .found { font-size: 12px; color: rgba(255, 255, 255, .8); max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keys button { height: 58px; border-radius: 999px; background: var(--key); color: var(--key-fg); font-size: 26px; font-weight: 900; box-shadow: 0 3px 0 rgba(0, 0, 0, .45), inset 0 -3px 0 rgba(0, 0, 0, .08); font-family: ui-rounded, var(--font); }
  [data-ui="kr"] .keys button { border-radius: 50%; width: 64px; height: 64px; justify-self: center; box-shadow: inset 0 0 0 1.5px rgba(45, 226, 255, .55), 0 0 12px rgba(45, 226, 255, .25); }
  .keys .clr { font-size: 14px; background: linear-gradient(#5fe0c8, #1aa890); color: #fff; }
  .keys .ok { font-size: 18px; background: var(--reserve); color: #fff; }
  [data-ui="kr"] .keys .clr { background: radial-gradient(circle at 50% 35%, #ff6a8a, #a8103a); color: #fff; }
  [data-ui="kr"] .keys .ok { color: #3a2400; }
  .ctls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .ctls button {
    min-height: 58px; padding: 6px 4px; border-radius: 10px; font-size: 13px; font-weight: 900; line-height: 1.2;
    background: var(--tile-b); box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .5), 0 3px 0 rgba(0, 0, 0, .4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .ctls button .sub { font-size: 9px; opacity: .75; }
  .ctls .o { background: var(--tile-o); }
  .ctls .r { background: var(--tile-r); }
  .ctls .g { background: var(--tile-g); }
  .ctls .wide { grid-column: span 3; min-height: 50px; }
  [data-ui="kr"] .ctls button { background: rgba(255, 255, 255, .04); box-shadow: inset 0 0 0 1.5px rgba(45, 226, 255, .55); color: #9af2ff; }
  [data-ui="kr"] .ctls .o { box-shadow: inset 0 0 0 1.5px rgba(255, 225, 77, .7); color: #ffe97a; }
  [data-ui="kr"] .ctls .r { box-shadow: inset 0 0 0 1.5px rgba(255, 74, 106, .8), 0 0 14px rgba(255, 74, 106, .3); color: #ff9aae; }
  [data-ui="kr"] .ctls .g { box-shadow: inset 0 0 0 1.5px rgba(80, 255, 160, .7); color: #a8ffd0; }
  .ptitle { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: rgba(255, 255, 255, .7); }

  /* ================= 曲の詳しい情報 ================= */
  #detail { position: fixed; inset: 0; z-index: 20; display: grid; place-items: end center; background: rgba(0, 0, 0, .55); animation: fade .2s; }
  @keyframes fade { from { opacity: 0; } }
  .sheet {
    width: min(640px, 100%); max-height: 92%; overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    border-radius: 18px 18px 0 0; background: linear-gradient(#2a1650, #160b2e); border: 1.5px solid rgba(255, 255, 255, .18); border-bottom: 0;

  // ================= Spotify（ログインは Lyrics Flow と共通） =================
  async function tokenRequest(body) {
    const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error_description || json.error || 'token error ' + res.status);
    store.set('lf_access', json.access_token);
    store.set('lf_expires', String(Date.now() + json.expires_in * 1000));
    if (json.refresh_token) store.set('lf_refresh', json.refresh_token);
    if (json.scope) store.set('lf_scope', json.scope);
    return json.access_token;
  }
  let refreshing = null;
  const refreshToken = () => (refreshing ||= tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('lf_refresh'), client_id: store.get('lf_client_id') }).finally(() => { refreshing = null; }));
  async function getToken() {
    if (Date.now() > (Number(store.get('lf_expires')) || 0) - 60_000) return refreshToken();
    return store.get('lf_access');
  }
  async function api(path, opts = {}, retried = false) {
    const token = await getToken();
    const res = await fetch(API + path, { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (res.status === 401 && !retried) { await refreshToken(); return api(path, opts, true); }
    if (opts.method && opts.method !== 'GET') {
      let reason = '';
      if (!res.ok) { try { const j = await res.json(); reason = (j.error && (j.error.reason || j.error.message)) || ''; } catch {} }
      return { ok: res.ok, status: res.status, reason };
    }
    if (res.status === 204) return null;
    if (!res.ok) { const e = new Error('Spotify API ' + res.status); e.status = res.status; throw e; }
    return res.json();
  }
  function opError(r) {
    if (/premium/i.test(r.reason)) return ui === 'kr' ? 'Spotify Premium이 필요해요' : '予約・操作には Spotify Premium が必要です';
    if (r.status === 404 || /no_active_device/i.test(r.reason)) return ui === 'kr' ? 'Spotify에서 먼저 재생해 주세요' : 'Spotify で何か再生してから操作してください';
    if (r.status === 401 || r.status === 403) return t('relogin');
    return '(' + r.status + ')';
  }

  }

  const smallImg = (imgs) => (imgs && imgs.length ? (imgs.find((i) => i.width && i.width <= 300) || imgs[imgs.length - 1]).url : '');
  const bigImg = (imgs) => (imgs && imgs.length ? imgs[0].url : '');
  function trackOf(x) {

      nos[songNo(tr.id, 'jp').replace('-', '')] = v;

  // 予約の音
  let ac = null;
  function chime() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime;
      const notes = ui === 'kr' ? [[880, 0], [1174.7, .1], [1568, .2]] : [[1046.5, 0], [1318.5, .14]];
      notes.forEach(([f, d]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = ui === 'kr' ? 'triangle' : 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.2, t0 + d + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .5);
        o.connect(g).connect(ac.destination); o.start(t0 + d); o.stop(t0 + d + .55);
      });
    } catch {}
  }

  const stack = [];

    try {
      const q = new URLSearchParams({ track_name: tr.name, artist_name: tr.artists.split(', ')[0], album_name: tr.album || '', duration: String(Math.round((tr.dur || 0) / 1000)) });
      const res = await fetch('https://lrclib.net/api/get?' + q);
      const j = res.ok ? await res.json() : null;
      if (dTrack !== tr) return;
      if (j && j.syncedLyrics) { lc.textContent = t('lyricsSynced'); lc.className = 'ok'; }
      else if (j && j.plainLyrics) { lc.textContent = t('lyricsPlain'); lc.className = ''; }
      else { lc.textContent = t('lyricsNone'); lc.className = 'no'; }
    } catch { if (dTrack === tr) { lc.textContent = t('lyricsNone'); } }
  }
  function closeDetail() { $('#detail').hidden = true; dTrack = null; }
  $('#dClose').onclick = closeDetail;
  $('#detail').addEventListener('click', (e) => { if (e.target.id === 'detail') closeDetail(); });
  $('#dRsv').onclick = () => dTrack && reserve(dTrack, $('#dRsv'));
  $('#dNow').onclick = () => { if (dTrack) { playNow(dTrack); closeDetail(); } };

  // ================= 演奏中と操作 =================
  let player = null;
  function renderNow() {
    const it = player && player.item;
    const lb = !it ? t('idle') : player.is_playing ? t('playing') : t('paused');
    const title = it ? it.name : t('idleTitle');
    const ar = it && it.artists ? it.artists.map((a) => a.name).join(', ') : '';
    const img = it ? smallImg(it.album && it.album.images) : '';
    $('#hLb').textContent = lb; $('#mLb').textContent = lb;
    $('#hTitle').textContent = title; $('#mTitle').textContent = title;
    markLang($('#hTitle'), title); markLang($('#mTitle'), title);
    $('#hArtist').textContent = ar; markLang($('#hArtist'), ar);
    if ($('#hArt').getAttribute('src') !== (it ? bigImg(it.album && it.album.images) : '')) $('#hArt').src = it ? bigImg(it.album && it.album.images) : '';
    if ($('#mArt').getAttribute('src') !== img) $('#mArt').src = img;
    $('#hBar').style.width = it && it.duration_ms ? (player.progress_ms / it.duration_ms * 100).toFixed(1) + '%' : '0';
    $('#pauseLbl').textContent = player && player.is_playing ? t('pause') : t('resume');
  }
  async function refreshNow() {
    try { player = await api('/me/player?additional_types=track'); } catch { /* 次を待つ */ }
    renderNow();
  }
  async function op(method, path, body) {
    const r = await api(path, { method, body });
    if (!r.ok) toast(t('cantOp'), opError(r), '', true);
    setTimeout(refreshNow, 500);
  }
  const seekBy = (d) => { if (!player || !player.item) return; op('PUT', '/me/player/seek?position_ms=' + Math.max(0, (player.progress_ms || 0) + d)); };
  const vol = (d) => { const v = player && player.device && player.device.volume_percent; if (v == null) { toast(t('cantOp'), '', '', true); return; } op('PUT', '/me/player/volume?volume_percent=' + Math.max(0, Math.min(100, v + d))); };
  const OPS = {
    rew: () => seekBy(-10000), ff: () => seekBy(10000), restart: () => op('PUT', '/me/player/seek?position_ms=0'),
    pause: () => op('PUT', player && player.is_playing ? '/me/player/pause' : '/me/player/play'),
    skip: () => op('POST', '/me/player/next'), prev: () => op('POST', '/me/player/previous'),
    volUp: () => vol(10), volDown: () => vol(-10), queue: () => go('queue'),
  };
  $$('[data-op]').forEach((b) => { b.onclick = () => { if (navigator.vibrate) navigator.vibrate(10); OPS[b.dataset.op](); }; });
  $('#footStop').onclick = OPS.skip;
  $('#miniNow').onclick = () => go('pad');

  // ================= アプリとして入れる（PWA） =================
  let installEvt = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (!standalone) { $('#installBox').hidden = false; $('#installBtn').hidden = false; } });
  $('#installBtn').onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; $('#installBox').hidden = true; };
  if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) { $('#installBox').hidden = false; $('#installBtn').hidden = true; $('#iosHint').hidden = false; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  // ================= 起動 =================
  $$('[data-go]').forEach((b) => { b.onclick = () => go(b.dataset.go); });
  $('#goTop').onclick = () => { stack.length = 0; go('home', false); };
  $('#goBack').onclick = back;
  $$('[data-ui-pick]').forEach((b) => { b.onclick = () => setUi(b.dataset.uiPick); });
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (!$('#detail').hidden) closeDetail(); else back(); } });

  function main() {
    if (!store.get('lf_refresh')) {
      $('#login').hidden = false;
      $('#loginLink').onclick = () => store.set('lf_after_login', '/lyrics/remote/');
      return;
    }
    $('#shell').hidden = false;
    applyUi();
    setKana(store.get('lf_remote_kana') === 'on');
    const h = location.hash.slice(1);
    go(h && VIEWS[h.split(':')[0]] ? h : 'home', false);
    refreshNow();
    setInterval(() => { if (document.visibilityState === 'visible') refreshNow(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshNow(); });
  }
  main();
})();
</script>
<script src="/assets/analytics.js" defer></script>
<script src="/assets/maintenance.js" defer></script>
</body>
</html>
