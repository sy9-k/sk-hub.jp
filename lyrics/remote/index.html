<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>選曲リモコン | Lyrics Flow</title>
<meta name="description" content="Lyrics Flow のカラオケで使う選曲リモコン。Spotify の曲を探して、予約（キューに追加）できる。">
<meta name="theme-color" content="#0c1230">
<link rel="canonical" href="https://sk-hub.jp/lyrics/remote/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Sans+KR:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@700;800&display=swap"></script>
<style>
  :root {
    --bg: #0c1230;
    --panel: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .1);
    --fg: #fff;
    --dim: rgba(255, 255, 255, .62);
    --accent: #ff9a1f;   /* 予約ボタン */
    --accent2: #ff5f8f;
    --blue: #4f7bff;
    --ok: #2fd27a;
    --round: "M PLUS Rounded 1c", "Noto Sans JP", "Noto Sans KR", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 60% at 50% -10%, #23307a 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--fg);
    font-family: "Noto Sans JP", "Hiragino Sans", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: calc(96px + env(safe-area-inset-bottom));
  }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  [hidden] { display: none !important; }
  [lang="ko"] { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }

  /* ================= 上: タイトルとタブ ================= */
  .top {
    position: sticky; top: 0; z-index: 5;
    padding: max(10px, env(safe-area-inset-top)) 14px 0;
    background: linear-gradient(rgba(12, 18, 48, .97), rgba(12, 18, 48, .9));
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; height: 40px; }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2)); font-weight: 900; font-size: 18px;
    box-shadow: 0 4px 14px rgba(255, 120, 60, .35);
  }
  .brand b { font-family: var(--round); font-size: 18px; letter-spacing: .04em; }
  .brand small { color: var(--dim); font-size: 12px; }
  .brand .sp { flex: 1; }
  .iconbtn { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); font-size: 16px; }
  .iconbtn[aria-pressed="false"] { opacity: .45; }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin: 8px -14px 0; padding: 0 14px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none; padding: 10px 14px 12px; font-size: 14px; font-weight: 700; color: var(--dim);
    border-bottom: 3px solid transparent; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: #fff; border-bottom-color: var(--accent); }
  .tab .count { display: inline-block; min-width: 20px; margin-left: 4px; padding: 1px 6px; border-radius: 999px; background: var(--accent2); color: #fff; font-size: 11px; text-align: center; }

  /* ================= 並び（広い画面では、左に検索と 50 音、右に一覧） ================= */
  .wrap { max-width: 1100px; margin: 0 auto; padding: 14px; }
  @media (min-width: 960px) {
    .wrap.split { display: grid; grid-template-columns: 420px 1fr; gap: 22px; align-items: start; }
    .wrap.split #searchArea { position: sticky; top: 112px; }
  }

  /* ================= 検索 ================= */
  .searchbar { display: flex; gap: 8px; }
  .searchbar .field { flex: 1; position: relative; }
  #q {
    width: 100%; height: 50px; padding: 0 44px 0 16px; border-radius: 14px;
    font: inherit; font-size: 17px; color: #fff; background: rgba(255, 255, 255, .09); border: 2px solid transparent; outline: none;
  }
  #q:focus { border-color: var(--blue); background: rgba(255, 255, 255, .12); }
  #q::placeholder { color: rgba(255, 255, 255, .4); }
  #clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; border-radius: 50%; color: var(--dim); font-size: 18px; }
  #kanaToggle {
    flex: none; height: 50px; padding: 0 14px; border-radius: 14px; font-weight: 800; font-size: 14px;
    background: var(--panel); border: 2px solid var(--line);
  }
  #kanaToggle[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); }

  /* 50 音キーボード */
  #kana { margin-top: 10px; padding: 10px; border-radius: 16px; background: rgba(0, 0, 0, .25); border: 1px solid var(--line); }
  .kgrid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; direction: rtl; } /* あ行を右に（デンモクと同じ向き） */
  .kgrid button, .krow button {
    height: 44px; border-radius: 9px; background: rgba(255, 255, 255, .1); font-family: var(--round); font-weight: 800; font-size: 18px;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .25); direction: ltr;
  }
  .kgrid button:active, .krow button:active { transform: translateY(1px); background: rgba(255, 255, 255, .22); }
  .kgrid .blank { visibility: hidden; }
  .krow { display: grid; grid-template-columns: repeat(4, 1fr) 1.5fr 1.5fr 1.5fr; gap: 5px; margin-top: 5px; }
  .krow .fn { font-size: 13px; background: rgba(255, 255, 255, .06); }
  .krow .del { background: rgba(255, 95, 143, .25); }
  @media (max-width: 420px) { .kgrid button, .krow button { height: 40px; font-size: 16px; } }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chips button { padding: 7px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 13px; color: var(--dim); }

  /* ================= 曲の一覧 ================= */
  .listhead { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 10px; }
  .listhead h2 { margin: 0; font-size: 15px; font-weight: 800; }
  .listhead span { font-size: 12px; color: var(--dim); }
  .item {
    display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; align-items: center; gap: 12px;
    padding: 10px; border-radius: 14px; background: var(--panel); margin-bottom: 8px;
    animation: rise .3s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .item img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: rgba(255, 255, 255, .08); }
  .item .t { font-weight: 800; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .a { margin-top: 3px; font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .no { margin-top: 4px; font-size: 11px; color: rgba(255, 255, 255, .45); font-variant-numeric: tabular-nums; letter-spacing: .03em; }
  .item .acts { display: flex; gap: 6px; }
  .rsv {
    min-width: 72px; height: 44px; padding: 0 14px; border-radius: 12px;
    font-family: var(--round); font-weight: 800; font-size: 16px; color: #3a1700;
    background: linear-gradient(#ffc04a, var(--accent)); box-shadow: 0 3px 0 #b85d00, 0 6px 14px rgba(255, 140, 30, .25);
  }
  .rsv:active { transform: translateY(2px); box-shadow: 0 1px 0 #b85d00; }
  .rsv.done { background: linear-gradient(#5be39a, var(--ok)); color: #053a1c; box-shadow: 0 3px 0 #13844a; }
  .now-btn { width: 44px; height: 44px; border-radius: 12px; background: rgba(255, 255, 255, .1); font-size: 15px; }
  .tag { display: inline-block; margin-right: 6px; padding: 1px 7px; border-radius: 6px; font-size: 11px; font-weight: 800; vertical-align: 1px; }
  .tag.playing { background: var(--accent2); }
  .tag.mine { background: var(--blue); }
  .item.current { background: linear-gradient(90deg, rgba(255, 95, 143, .22), rgba(255, 255, 255, .05)); }
  .empty { padding: 40px 10px; text-align: center; color: var(--dim); line-height: 1.8; font-size: 14px; }
  .note { margin: 10px 2px; font-size: 12px; color: rgba(255, 255, 255, .45); line-height: 1.7; }
  .more { display: block; width: 100%; margin: 6px 0 0; padding: 12px; border-radius: 12px; background: var(--panel); color: var(--dim); font-weight: 700; }

  /* ================= 下: 演奏中と操作 ================= */
  .now {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(8, 12, 34, .96); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  }
  .now .in { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
  .now img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; background: rgba(255, 255, 255, .08); }
  .now .lbl { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: .08em; }
  .now .t { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .a { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ctl { display: flex; gap: 6px; }
  .ctl button { min-width: 46px; height: 46px; padding: 0 10px; border-radius: 12px; background: rgba(255, 255, 255, .1); font-size: 12px; font-weight: 800; line-height: 1.15; }
  .ctl .stop { background: rgba(255, 95, 143, .3); }
  .ctl .vol { min-width: 38px; }
  @media (max-width: 520px) {
    .now .in { grid-template-columns: 40px minmax(0, 1fr); }
    .now img { width: 40px; height: 40px; }
    .ctl { grid-column: 1 / -1; justify-content: space-between; }
    .ctl button { flex: 1; }
    body { padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
  }

  /* ================= 予約しました ================= */
  #toast {
    position: fixed; z-index: 20; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.9);
    width: min(360px, calc(100vw - 40px)); padding: 18px 20px; border-radius: 18px; text-align: center;
    background: linear-gradient(160deg, #ffb935, #ff7a1a); color: #3a1700; box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
    opacity: 0; pointer-events: none; transition: opacity .25s, transform .35s cubic-bezier(.3, 1.4, .5, 1);
    font-family: var(--round); font-weight: 800;
  }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #toast.err { background: linear-gradient(160deg, #ff7a9a, #e0335f); color: #fff; }
  #toast .big { font-size: 22px; }
  #toast .sub { margin-top: 6px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #toast .no { margin-top: 6px; font-size: 13px; opacity: .8; font-variant-numeric: tabular-nums; }

  /* ================= ログイン ================= */
  #login { max-width: 460px; margin: 60px auto; padding: 24px; text-align: center; }
  #login h1 { font-family: var(--round); font-size: 24px; }
  #login p { color: var(--dim); line-height: 1.8; font-size: 14px; }
  #login a.btn { display: inline-block; margin-top: 10px; padding: 14px 24px; border-radius: 999px; background: #1ed760; color: #000; font-weight: 800; text-decoration: none; }
</style>
</head>
<body>

<header class="top" id="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">♪</span>
    <div><b>選曲リモコン</b><br><small>Lyrics Flow</small></div>
    <span class="sp"></span>
    <button class="iconbtn" id="sound" aria-pressed="true" title="予約の音">🔔</button>
    <a class="iconbtn" href="/lyrics/" title="Lyrics Flow を開く" style="color:inherit;text-decoration:none">♫</a>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" data-tab="song" aria-selected="true">曲名で探す</button>
    <button class="tab" role="tab" data-tab="artist">歌手名で探す</button>
    <button class="tab" role="tab" data-tab="recent">履歴</button>
    <button class="tab" role="tab" data-tab="top">よく聴く曲</button>
    <button class="tab" role="tab" data-tab="queue">予約一覧<span class="count" id="qcount" hidden></span></button>
  </nav>
</header>

<section id="login" hidden>
  <h1>選曲リモコン</h1>
  <p>Spotify にログインすると、曲を探して予約できます。<br>ログインは Lyrics Flow と共通です。</p>
  <a class="btn" id="loginLink" href="/lyrics/">Lyrics Flow でログイン</a>
</section>

<div class="wrap split" id="app" hidden>
  <section id="searchArea">
    <div class="searchbar">
      <div class="field">
        <input id="q" type="search" enterkeyhint="search" autocomplete="off" spellcheck="false" placeholder="曲名を入力">
        <button id="clear" aria-label="消す">×</button>
      </div>
      <button id="kanaToggle" aria-pressed="false" title="50 音キーボード">50音</button>
    </div>
    <div id="kana" hidden>
      <div class="kgrid" id="kgrid"></div>
      <div class="krow">
        <button data-fn="dakuten">゛</button>
        <button data-fn="handaku">゜</button>
        <button data-fn="small">小</button>
        <button data-k="ー">ー</button>
        <button class="fn" data-k=" ">空白</button>
        <button class="fn del" data-fn="back">1 字消す</button>
        <button class="fn del" data-fn="clear">全部消す</button>
      </div>
    </div>
    <div class="chips" id="hints"></div>
  </section>

  <section>
    <div class="listhead"><h2 id="listTitle">さがした曲</h2><span id="listInfo"></span></div>
    <div id="list"></div>
  </section>
</div>

<footer class="now" id="now" hidden>
  <div class="in">
    <img id="nowArt" src="" alt="">
    <div style="min-width:0">
      <div class="lbl" id="nowLbl">演奏中</div>
      <div class="t" id="nowTitle">—</div>
      <div class="a" id="nowArtist"></div>
    </div>
    <div class="ctl">
      <button id="restart" title="頭から">頭<br>から</button>
      <button id="pause" title="一時停止 / 再開">一時<br>停止</button>
      <button class="stop" id="skip" title="演奏中止（次の曲へ）">演奏<br>中止</button>
      <button class="vol" id="volDown" title="音量を下げる">音<br>−</button>
      <button class="vol" id="volUp" title="音量を上げる">音<br>＋</button>
    </div>
  </div>
</footer>

<div id="toast" role="status" aria-live="polite"><div class="big"></div><div class="sub"></div><div class="no"></div></div>

<script>
(() => {
  'use strict';
  // ログイン（トークン）は Lyrics Flow（/lyrics/）と同じものを使う（同じサイトなので localStorage を共有）
  const API = 'https://api.spotify.com/v1';
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ================= Spotify =================
  async function tokenRequest(body) {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error_description || json.error || 'token error ' + res.status);
    store.set('lf_access', json.access_token);
    store.set('lf_expires', String(Date.now() + json.expires_in * 1000));
    if (json.refresh_token) store.set('lf_refresh', json.refresh_token);
    if (json.scope) store.set('lf_scope', json.scope);
    return json.access_token;
  }
  let refreshing = null;
  function refreshToken() {
    if (!refreshing) {
      refreshing = tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('lf_refresh'), client_id: store.get('lf_client_id') })
        .finally(() => { refreshing = null; });
    }
    return refreshing;
  }
  async function getToken() {
    // ほかのタブ（Lyrics Flow）が先に新しくしていることもあるので、毎回 localStorage から読む
    if (Date.now() > (Number(store.get('lf_expires')) || 0) - 60_000) return refreshToken();
    return store.get('lf_access');
  }
  // GET は JSON を返す。PUT・POST は { ok, status, reason } を返す
  async function api(path, opts = {}, retried = false) {
    const token = await getToken();
    const res = await fetch(API + path, { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (res.status === 401 && !retried) { await refreshToken(); return api(path, opts, true); }
    if (opts.method && opts.method !== 'GET') {
      let reason = '';
      if (!res.ok) { try { const j = await res.json(); reason = (j.error && (j.error.reason || j.error.message)) || ''; } catch {} }
      return { ok: res.ok, status: res.status, reason };
    }
    if (res.status === 204) return null;
    if (!res.ok) { const e = new Error('Spotify API ' + res.status); e.status = res.status; throw e; }
    return res.json();
  }
  function opError(r) {
    if (/premium/i.test(r.reason)) return '予約・操作には Spotify Premium が必要です';
    if (r.status === 404 || /no_active_device|NO_ACTIVE/i.test(r.reason)) return 'Spotify で何か再生してから操作してください';
    if (r.status === 401 || r.status === 403) return 'もう一度ログインしてください（Lyrics Flow でログアウト → ログイン）';
    if (r.status === 429) return '少し時間をおいてから試してください';
    return '操作できませんでした（' + r.status + '）';
  }

  // ================= 小道具 =================
  const HANGUL = /[ᄀ-ᇿ㄰-㆏가-힯]/;
  function markLang(el, text) { if (HANGUL.test(text)) el.lang = 'ko'; else el.removeAttribute('lang'); }
  // Lyrics Flow と同じ「選曲番号」（曲の ID から作る飾りの番号）
  function songNo(id) {
    let h = 0;
    for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return (1000 + (h % 9000)) + '-' + String(h % 100).padStart(2, '0');
  }
  const fmt = (ms) => { const s = Math.round(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const smallImg = (imgs) => (imgs && imgs.length ? (imgs.find((i) => i.width && i.width <= 300) || imgs[imgs.length - 1]).url : '');

  // 予約の音（「ピンポン」）
  let ac = null;
  let soundOn = store.get('lf_remote_sound') !== 'off';
  function chime() {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t = ac.currentTime;
      [[1046.5, 0], [1318.5, .14]].forEach(([f, d]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t + d);
        g.gain.linearRampToValueAtTime(.2, t + d + .01);
        g.gain.exponentialRampToValueAtTime(.001, t + d + .6);
        o.connect(g).connect(ac.destination);
        o.start(t + d); o.stop(t + d + .65);
      });
    } catch {}
  }

  let toastTimer = 0;
  function toast(big, sub, no, err) {
    const el = $('#toast');
    el.classList.toggle('err', !!err);
    el.querySelector('.big').textContent = big;
    const s = el.querySelector('.sub'); s.textContent = sub || ''; markLang(s, sub || '');
    el.querySelector('.no').textContent = no || '';
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), err ? 2600 : 1800);
  }

  // このリモコンで予約した曲（予約一覧で「予約」の印を付ける）
  const mine = new Set(JSON.parse(sessionStorage.getItem('lf_remote_mine') || '[]'));
  function remember(id) { mine.add(id); try { sessionStorage.setItem('lf_remote_mine', JSON.stringify([...mine])); } catch {} }

  // ================= 予約・今すぐ演奏 =================
  async function reserve(track, btn) {
    btn.disabled = true;
    const r = await api('/me/player/queue?uri=' + encodeURIComponent(track.uri), { method: 'POST' });
    btn.disabled = false;
    if (!r.ok) { toast('予約できませんでした', opError(r), '', true); return; }
    remember(track.id);
    btn.classList.add('done');
    btn.textContent = '予約済';
    chime();
    if (navigator.vibrate) navigator.vibrate(30);
    toast('予約しました', track.name, '選曲番号 ' + songNo(track.id));
    setTimeout(refreshNow, 600);
  }
  async function playNow(track) {
    const r = await api('/me/player/play', { method: 'PUT', body: { uris: [track.uri] } });
    if (!r.ok) { toast('演奏できませんでした', opError(r), '', true); return; }
    toast('演奏します', track.name, '選曲番号 ' + songNo(track.id));
    setTimeout(refreshNow, 600);
  }

  // ================= 一覧を描く =================
  function trackOf(t) {
    return {
      id: t.id, uri: t.uri, name: t.name,
      artists: (t.artists || []).map((a) => a.name).join(', '),
      art: smallImg(t.album && t.album.images), dur: t.duration_ms,
    };
  }
  function renderList(tracks, opts = {}) {
    const list = $('#list');
    if (!opts.append) list.textContent = '';
    if (!tracks.length && !opts.append) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = opts.empty || '曲が見つかりませんでした';
      list.appendChild(d);
      return;
    }
    tracks.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'item' + (t.current ? ' current' : '');
      row.style.animationDelay = Math.min(i, 12) * 25 + 'ms';
      const img = document.createElement('img'); img.src = t.art || ''; img.alt = ''; img.loading = 'lazy';
      const meta = document.createElement('div'); meta.style.minWidth = '0';
      const tt = document.createElement('div'); tt.className = 't';
      if (t.current) { const g = document.createElement('span'); g.className = 'tag playing'; g.textContent = '演奏中'; tt.appendChild(g); }
      else if (mine.has(t.id) && opts.queue) { const g = document.createElement('span'); g.className = 'tag mine'; g.textContent = '予約'; tt.appendChild(g); }
      if (opts.queue && !t.current) { const n = document.createElement('span'); n.className = 'tag'; n.style.background = 'rgba(255,255,255,.14)'; n.textContent = (t.pos) + ' 曲目'; tt.appendChild(n); }
      tt.appendChild(document.createTextNode(t.name)); markLang(tt, t.name);
      const aa = document.createElement('div'); aa.className = 'a'; aa.textContent = t.artists + (t.dur ? ' ・ ' + fmt(t.dur) : ''); markLang(aa, t.artists);
      const no = document.createElement('div'); no.className = 'no'; no.textContent = '選曲番号 ' + songNo(t.id);
      meta.append(tt, aa, no);
      const acts = document.createElement('div'); acts.className = 'acts';
      if (!opts.queue) {
        const now = document.createElement('button'); now.className = 'now-btn'; now.textContent = '▶'; now.title = '今すぐ演奏（割り込み）';
        now.onclick = () => playNow(t);
        const rsv = document.createElement('button'); rsv.className = 'rsv'; rsv.textContent = '予約';
        rsv.onclick = () => reserve(t, rsv);
        acts.append(now, rsv);
      }
      row.append(img, meta, acts);
      list.appendChild(row);
    });
  }
  function setHead(title, info) { $('#listTitle').textContent = title; $('#listInfo').textContent = info || ''; }
  function loading() { const l = $('#list'); l.textContent = ''; const d = document.createElement('div'); d.className = 'empty'; d.textContent = '読み込み中…'; l.appendChild(d); }

  // ================= タブ =================
  let tab = 'song';
  let searchSeq = 0, nextUrl = null;
  function setTab(name) {
    tab = name;
    $$('.tab').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === name)));
    const searching = name === 'song' || name === 'artist';
    $('#searchArea').hidden = !searching;
    $('#app').classList.toggle('split', searching);
    $('#q').placeholder = name === 'artist' ? '歌手名を入力' : '曲名を入力';
    if (searching) { runSearch(); renderHints(); }
    else if (name === 'recent') loadRecent();
    else if (name === 'top') loadTop();
    else if (name === 'queue') loadQueue();
  }
  $$('.tab').forEach((b) => { b.onclick = () => setTab(b.dataset.tab); });

  // ---------- 探す ----------
  async function runSearch(more) {
    const q = $('#q').value.trim();
    const seq = ++searchSeq;
    if (!q) {
      setHead(tab === 'artist' ? '歌手名で探す' : '曲名で探す', '');
      renderList([], { empty: tab === 'artist' ? '歌手名を入れると、その歌手の曲が出ます' : '曲名を入れると、Spotify から探します' });
      return;
    }
    if (!more) { loading(); nextUrl = null; }
    try {
      const params = new URLSearchParams({ type: 'track', limit: '20', market: 'from_token', q: tab === 'artist' ? 'artist:"' + q + '"' : q });
      const path = more && nextUrl ? nextUrl.replace(API, '') : '/search?' + params;
      const data = await api(path);
      if (seq !== searchSeq) return;
      const items = ((data && data.tracks && data.tracks.items) || []).filter(Boolean).map(trackOf);
      nextUrl = data && data.tracks && data.tracks.next;
      setHead('「' + q + '」の曲', (data && data.tracks ? data.tracks.total : 0) + ' 曲');
      $('.more') && $('.more').remove();
      renderList(items, { append: !!more });
      if (nextUrl && items.length) {
        const m = document.createElement('button'); m.className = 'more'; m.textContent = 'もっと見る';
        m.onclick = () => { m.remove(); runSearch(true); };
        $('#list').appendChild(m);
      }
    } catch (e) {
      if (seq === searchSeq) renderList([], { empty: '探せませんでした（' + (e.status || '通信') + '）' });
    }
  }
  let typing = 0;
  $('#q').addEventListener('input', () => { clearTimeout(typing); typing = setTimeout(() => runSearch(), 350); });
  $('#q').addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(typing); runSearch(); $('#q').blur(); } });
  $('#clear').onclick = () => { $('#q').value = ''; runSearch(); };

  // 最近探した言葉
  function hints() { try { return JSON.parse(store.get('lf_remote_hist') || '[]'); } catch { return []; } }
  function pushHint(q) { const h = [q, ...hints().filter((x) => x !== q)].slice(0, 8); store.set('lf_remote_hist', JSON.stringify(h)); }
  function renderHints() {
    const box = $('#hints'); box.textContent = '';
    hints().forEach((q) => { const b = document.createElement('button'); b.textContent = q; markLang(b, q); b.onclick = () => { $('#q').value = q; runSearch(); }; box.appendChild(b); });
  }
  $('#q').addEventListener('change', () => { const q = $('#q').value.trim(); if (q) { pushHint(q); renderHints(); } });

  // ---------- 50 音キーボード ----------
  const ROWS = ['あかさたなはまやらわ', 'いきしちにひみ り ', 'うくすつぬふむゆるを', 'えけせてねへめ れ ', 'おこそとのほもよろん'];
  const grid = $('#kgrid');
  // 列ごと（あ行・か行…）に縦に並べるため、行と列を入れ替えて置く
  for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) {
    const ch = ROWS[r][c] || ' ';
    const b = document.createElement('button');
    if (ch === ' ') b.className = 'blank'; else { b.textContent = ch; b.dataset.k = ch; }
    b.style.gridRow = String(r + 1); b.style.gridColumn = String(c + 1);
    grid.appendChild(b);
  }
  const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ', う: 'ゔ' };
  const HANDAKU = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
  const SMALL = { あ: 'ぁ', い: 'ぃ', う: 'ぅ', え: 'ぇ', お: 'ぉ', つ: 'っ', や: 'ゃ', ゆ: 'ゅ', よ: 'ょ', わ: 'ゎ' };
  // 最後の 1 字を、゛゜小 で変える（もう一度押すと元に戻る）
  function toggleLast(map) {
    const inp = $('#q'), v = inp.value, last = v.slice(-1);
    const inv = Object.fromEntries(Object.entries(map).map(([a, b]) => [b, a]));
    const to = map[last] || inv[last];
    if (to) { inp.value = v.slice(0, -1) + to; kanaChanged(); }
  }
  function kanaChanged() { clearTimeout(typing); typing = setTimeout(() => runSearch(), 450); }
  $('#kana').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const inp = $('#q');
    if (b.dataset.k) { inp.value += b.dataset.k; kanaChanged(); }
    else if (b.dataset.fn === 'dakuten') toggleLast(DAKU);
    else if (b.dataset.fn === 'handaku') toggleLast(HANDAKU);
    else if (b.dataset.fn === 'small') toggleLast(SMALL);
    else if (b.dataset.fn === 'back') { inp.value = inp.value.slice(0, -1); kanaChanged(); }
    else if (b.dataset.fn === 'clear') { inp.value = ''; kanaChanged(); }
    if (navigator.vibrate) navigator.vibrate(8);
  });
  function setKana(on) {
    $('#kana').hidden = !on;
    $('#kanaToggle').setAttribute('aria-pressed', String(on));
    $('#q').inputMode = on ? 'none' : 'search'; // 50 音のときは、端末のキーボードを出さない
    store.set('lf_remote_kana', on ? 'on' : 'off');
  }
  $('#kanaToggle').onclick = () => setKana($('#kana').hidden);

  // ---------- 履歴・よく聴く曲 ----------
  async function loadRecent() {
    setHead('履歴', '最近聴いた曲'); loading();
    try {
      const data = await api('/me/player/recently-played?limit=50');
      const seen = new Set();
      const items = ((data && data.items) || []).map((x) => x.track).filter((t) => t && !seen.has(t.id) && seen.add(t.id)).map(trackOf);
      if (tab === 'recent') renderList(items, { empty: '最近聴いた曲はありません' });
    } catch (e) {
      if (tab === 'recent') renderList([], { empty: e.status === 403 || e.status === 401 ? '履歴を見るには、もう一度ログインしてください（Lyrics Flow でログアウト → ログイン）' : '読み込めませんでした' });
    }
  }
  let topRange = 'short_term';
  async function loadTop() {
    setHead('よく聴く曲', { short_term: 'この 4 週間', medium_term: 'この半年', long_term: 'この 1 年' }[topRange]); loading();
    try {
      const data = await api('/me/top/tracks?limit=50&time_range=' + topRange);
      if (tab !== 'top') return;
      renderList(((data && data.items) || []).map(trackOf), { empty: 'まだありません' });
      const box = document.createElement('div'); box.className = 'chips'; box.style.marginBottom = '10px';
      [['short_term', '4 週間'], ['medium_term', '半年'], ['long_term', '1 年']].forEach(([k, label]) => {
        const b = document.createElement('button'); b.textContent = label;
        if (k === topRange) { b.style.color = '#fff'; b.style.borderColor = 'var(--accent)'; }
        b.onclick = () => { topRange = k; loadTop(); };
        box.appendChild(b);
      });
      $('#list').prepend(box);
    } catch (e) {
      if (tab === 'top') renderList([], { empty: e.status === 403 || e.status === 401 ? 'よく聴く曲を見るには、もう一度ログインしてください（Lyrics Flow でログアウト → ログイン）' : '読み込めませんでした' });
    }
  }

  // ---------- 予約一覧（Spotify のキュー） ----------
  async function loadQueue(quiet) {
    if (!quiet) { setHead('予約一覧', ''); loading(); }
    try {
      const data = await api('/me/player/queue');
      const cur = data && data.currently_playing;
      const q = ((data && data.queue) || []).filter((t) => t && t.type === 'track');
      updateCount(q);
      if (tab !== 'queue') return;
      const rows = [];
      if (cur && cur.type === 'track') rows.push({ ...trackOf(cur), current: true });
      q.forEach((t, i) => rows.push({ ...trackOf(t), pos: i + 1 }));
      setHead('予約一覧', q.length + ' 曲');
      renderList(rows, { queue: true, empty: '予約はありません。曲を探して「予約」を押してください' });
      const n = document.createElement('p'); n.className = 'note';
      n.textContent = 'Spotify のキュー（次に流れる順）です。プレイリストやアルバムの続きも並びます。予約の取り消しは Spotify のアプリでしてください。';
      $('#list').appendChild(n);
    } catch (e) {
      if (tab === 'queue' && !quiet) renderList([], { empty: '読み込めませんでした' });
    }
  }
  function updateCount(q) {
    const n = q.filter((t) => mine.has(t.id)).length;
    const c = $('#qcount');
    c.hidden = !n; c.textContent = n;
  }

  // ================= 演奏中と操作 =================
  let player = null;
  async function refreshNow() {
    try {
      player = await api('/me/player?additional_types=track');
      const it = player && player.item;
      $('#now').hidden = false;
      $('#nowLbl').textContent = !it ? '演奏していません' : player.is_playing ? '演奏中' : '一時停止中';
      $('#nowTitle').textContent = it ? it.name : 'Spotify で再生すると、ここに出ます';
      markLang($('#nowTitle'), it ? it.name : '');
      const ar = it && it.artists ? it.artists.map((a) => a.name).join(', ') : '';
      $('#nowArtist').textContent = ar; markLang($('#nowArtist'), ar);
      $('#nowArt').src = it ? smallImg(it.album && it.album.images) : '';
      $('#pause').innerHTML = player && player.is_playing ? '一時<br>停止' : '再生';
      if (tab === 'queue') loadQueue(true);
      else api('/me/player/queue').then((d) => updateCount(((d && d.queue) || []).filter(Boolean))).catch(() => {});
    } catch (e) { /* つながらないときは、次の取得を待つ */ }
  }
  async function op(method, path, body) {
    const r = await api(path, { method, body });
    if (!r.ok) toast('操作できませんでした', opError(r), '', true);
    setTimeout(refreshNow, 500);
    return r.ok;
  }
  $('#restart').onclick = () => op('PUT', '/me/player/seek?position_ms=0');
  $('#pause').onclick = () => op('PUT', player && player.is_playing ? '/me/player/pause' : '/me/player/play');
  $('#skip').onclick = () => op('POST', '/me/player/next');
  const vol = (d) => {
    const v = player && player.device && player.device.volume_percent;
    if (v == null) { toast('音量を変えられません', 'この端末は Spotify から音量を変えられません', '', true); return; }
    op('PUT', '/me/player/volume?volume_percent=' + Math.max(0, Math.min(100, v + d)));
  };
  $('#volDown').onclick = () => vol(-10);
  $('#volUp').onclick = () => vol(10);
  $('#sound').onclick = () => {
    soundOn = !soundOn;
    store.set('lf_remote_sound', soundOn ? 'on' : 'off');
    $('#sound').setAttribute('aria-pressed', String(soundOn));
    if (soundOn) chime();
  };

  // ================= 起動 =================
  function main() {
    if (!store.get('lf_refresh')) {
      // ログインは Lyrics Flow で。終わったらここへ戻る
      $('#login').hidden = false;
      $('#loginLink').onclick = () => store.set('lf_after_login', '/lyrics/remote/');
      $$('.tabs').forEach((t) => { t.hidden = true; });
      return;
    }
    $('#app').hidden = false;
    $('#sound').setAttribute('aria-pressed', String(soundOn));
    setKana(store.get('lf_remote_kana') === 'on');
    setTab('song');
    refreshNow();
    setInterval(() => { if (document.visibilityState === 'visible') refreshNow(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshNow(); });
  }
  main();
})();
</script>
<script src="/assets/analytics.js" defer></script>
<script src="/assets/maintenance.js" defer></script>
</body>
</html>
