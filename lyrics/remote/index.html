<style>
  /* =====================================================================
     しくみ: 画面は決まった大きさ（横長は高さ 800・縦長は幅 720。もう一方は画面の比に合わせる）で作り、
     ブラウザの大きさに合わせて丸ごと拡大・縮小する（どの画面でも大きく、配置もくずれない）
     ===================================================================== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #0b0716; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }

  /* ================= 色（日本風 = 既定 / 韓国風 = data-ui="kr"） ================= */
  :root {

    --teal: linear-gradient(#45d8c4, #14a892 52%, #0b7e6e);
    --purple: linear-gradient(#b884ff, #8a4ae8 52%, #6428c0);
    --pink: linear-gradient(#ff8ad0, #f24aa8 52%, #c81f80);
    --white-tile: linear-gradient(#ffffff, #eef0f8);
    --edge: 0 0 0 2px #fff, 0 3px 0 rgba(60, 20, 80, .35), 0 6px 14px rgba(60, 20, 80, .25);

    --pad-bg: radial-gradient(120% 90% at 50% 0%, #a3162a 0%, #5a0a18 55%, #2a0610 100%);

  }
  [data-ui="kr"] {
    --font: "Noto Sans KR", "Noto Sans JP", sans-serif;
        --screen: radial-gradient(120% 90% at 20% 0%, #1a2a6a 0%, #0c1030 55%, #05060f 100%);
    --ink: #e8f6ff; --ink2: #8ea4d8;
    --red: linear-gradient(160deg, rgba(255, 63, 164, .3), rgba(255, 63, 164, .08));
    --orange: linear-gradient(160deg, rgba(255, 225, 77, .28), rgba(255, 225, 77, .06));
    --navy: linear-gradient(160deg, rgba(45, 226, 255, .26), rgba(45, 226, 255, .06));
    --teal: linear-gradient(160deg, rgba(80, 255, 160, .24), rgba(80, 255, 160, .06));
    --purple: linear-gradient(160deg, rgba(139, 92, 255, .34), rgba(139, 92, 255, .08));
    --pink: linear-gradient(160deg, rgba(255, 110, 200, .32), rgba(255, 110, 200, .08));
    --white-tile: linear-gradient(160deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .03));
    --edge: inset 0 0 0 1.5px rgba(255, 255, 255, .2);
    --status: linear-gradient(#10163c, #0a0d26);
    --dock: linear-gradient(#0e1438, #080b20);

  /* ================= 画面（枠なし。拡大・縮小した画面いっぱいを使う） ================= */

  /* ================= 画面の中身 ================= */
  .views { position: relative; overflow: hidden; background: var(--screen); display: grid; grid-template-rows: auto 1fr; }
  .vbar { display: flex; gap: 8px; align-items: center; padding: 10px 12px 0; }

  [data-orient="port"] .home { grid-template-columns: 1fr; grid-template-rows: 264px 54px 150px 104px 214px 1fr;
    grid-template-areas: "tv" "search" "big" "pills" "lower" "left2"; }

  /* テレビのような「演奏中」の画面 */
  .tv { grid-area: tv; display: grid; grid-template-rows: 1fr 34px 42px; border-radius: 14px; overflow: hidden; background: #1b1b22; box-shadow: 0 0 0 4px #2b2b33, 0 8px 22px rgba(60, 20, 80, .35); }
  [data-ui="kr"] .tv { box-shadow: 0 0 0 2px rgba(45, 226, 255, .5), 0 0 26px rgba(45, 226, 255, .2); }
  .tvscreen { position: relative; overflow: hidden; margin: 8px 8px 0; border-radius: 8px; background: radial-gradient(120% 120% at 30% 20%, #3c2a72, #12091f); }
  .tvnow { position: absolute; inset: 0; display: grid; grid-template-columns: 46% 1fr; gap: 14px; align-items: center; padding: 14px; }

  [data-ui="kr"] .tvnow .lb { color: #04202a; }
  .tvnow .tt { margin-top: 8px; font-size: 22px; font-weight: 900; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tvnow .aa { margin-top: 4px; font-size: 14px; color: rgba(255, 255, 255, .75); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tvnow .no { margin-top: 8px; font-size: 12px; color: rgba(255, 255, 255, .55); font-variant-numeric: tabular-nums; }

  .tvtabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 8px 8px; }

  /* タイル */
  .tile {
    position: relative; overflow: hidden; border-radius: 12px; box-shadow: var(--edge);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
    font-weight: 900; line-height: 1.15; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .28);
  }
  .tile::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 46%; background: linear-gradient(rgba(255, 255, 255, .34), rgba(255, 255, 255, .06)); pointer-events: none; }
  .tile:active { transform: translateY(2px); filter: brightness(1.08); }
  .tile svg { width: 34px; height: 34px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  .tile .sub { font-size: 11px; font-weight: 700; opacity: .8; text-shadow: none; }
  .sub:empty { display: none; }
  .t-r { background: var(--red); } .t-o { background: var(--orange); } .t-n { background: var(--navy); } .t-t { background: var(--teal); }
  .t-v { background: var(--purple); } .t-p { background: var(--pink); }

  .big { grid-area: big; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  .left2 { grid-area: left2; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }

  /* ================= スマホ（縦長）: 前の形の画面 ================= */

  .pnow .lb { display: inline-block; padding: 2px 9px; border-radius: 6px; font-size: 12px; font-weight: 900; background: var(--accent); color: #2a1a00; }
  [data-ui="kr"] .pnow .lb { color: #04202a; }
  .pnow .tt { margin-top: 6px; font-size: 21px; font-weight: 900; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* ================= 探す ================= */

  /* ================= 一覧 ================= */
  .lhead { display: flex; justify-content: space-between; align-items: baseline; margin: 8px 2px 8px; }

  .lhead span { font-size: 13px; color: rgba(255, 255, 255, .6); }

    display: grid; grid-template-columns: 30px minmax(0, 1.3fr) minmax(0, 1fr) auto; align-items: center; gap: 12px;
    min-height: 60px; padding: 6px 8px 6px 10px; margin-bottom: 5px; border-radius: 8px; background: var(--row);
    border: 1px solid var(--row-edge); text-align: left; width: 100%; animation: rin .25s ease both; cursor: pointer;
  }

  [data-ui="kr"] .row .ic { background: linear-gradient(#2de2ff, #1a8ad8); }

  .rsv { width: 54px; height: 54px; border-radius: 50%; background: var(--reserve); font-weight: 900; font-size: 15px; box-shadow: 0 3px 0 rgba(0, 0, 0, .4), inset 0 2px 0 rgba(255, 255, 255, .35); text-shadow: 0 1px 0 rgba(0, 0, 0, .3); }

  [data-orient="port"] .row { grid-template-columns: 30px minmax(0, 1fr) auto; }

  /* らくらく（文字を大きく） */

  /* ================= リモコン ================= */

  .disp .found { font-size: 13px; color: rgba(255, 255, 255, .85); max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }

  [data-ui="kr"] .keys button { border-radius: 50%; width: 74px; height: 74px; justify-self: center; box-shadow: inset 0 0 0 1.5px rgba(45, 226, 255, .55), 0 0 12px rgba(45, 226, 255, .25); }

  #toast {
    position: absolute; z-index: 30; left: 50%; top: 44%; transform: translate(-50%, -50%) scale(.9);

  function fit() {
    // 入力中にキーボードが出て高さだけ変わったときは、そのまま（画面がちぢむと打ちにくい）
    if (document.activeElement && document.activeElement.tagName === 'INPUT' && innerWidth === lastW) return;

    const ratio = innerWidth / innerHeight;
    const land = ratio >= .95;
    // 画面の縦横の比に合わせて、横長は幅を・縦長は高さをのばす（すきまが出ないように）
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const W = land ? Math.round(clamp(800 * ratio, 1180, 1640)) : 720;

    stage.style.width = W + 'px';
    stage.style.height = H + 'px';

  // ================= Spotify（ログインは Lyrics Flow と共通） =================
  async function tokenRequest(body) {
    const res = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(body) });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error_description || json.error || 'token error ' + res.status);
    store.set('lf_access', json.access_token);
    store.set('lf_expires', String(Date.now() + json.expires_in * 1000));
    if (json.refresh_token) store.set('lf_refresh', json.refresh_token);
    if (json.scope) store.set('lf_scope', json.scope);
    return json.access_token;
  }
  let refreshing = null;
  const refreshToken = () => (refreshing ||= tokenRequest({ grant_type: 'refresh_token', refresh_token: store.get('lf_refresh'), client_id: store.get('lf_client_id') }).finally(() => { refreshing = null; }));
  async function getToken() {
    if (Date.now() > (Number(store.get('lf_expires')) || 0) - 60_000) return refreshToken();
    return store.get('lf_access');
  }
  async function api(path, opts = {}, retried = false) {
    const token = await getToken();
    const res = await fetch(API + path, { method: opts.method || 'GET', headers: { Authorization: 'Bearer ' + token, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) }, body: opts.body ? JSON.stringify(opts.body) : undefined });
    if (res.status === 401 && !retried) { await refreshToken(); return api(path, opts, true); }
    if (opts.method && opts.method !== 'GET') {
      let reason = '';
      if (!res.ok) { try { const j = await res.json(); reason = (j.error && (j.error.reason || j.error.message)) || ''; } catch {} }
      return { ok: res.ok, status: res.status, reason };
    }
    if (res.status === 204) return null;
    if (!res.ok) {
      // 403・429・5xx は一時的なことがあるので、少し待って 1 回だけやり直す
      if (!opts.retry && (res.status === 403 || res.status === 429 || res.status >= 500)) {
        const wait = res.status === 429 ? Math.min(5000, (Number(res.headers.get('Retry-After')) || 1) * 1000) : 700;
        await new Promise((r) => setTimeout(r, wait));
        return api(path, { ...opts, retry: true }, retried);
      }
      let msg = '';
      try { const j = await res.json(); msg = (j.error && (j.error.message || j.error.reason)) || ''; } catch {}
      const e = new Error('Spotify API ' + res.status + (msg ? ': ' + msg : ''));
      e.status = res.status; e.msg = msg;
      throw e;
    }
    return res.json();
  }
  // 読み込めなかった理由（403 のときは、よくある原因を添える）
  function whyFailed(e) {
    const m = e && e.msg ? '（' + e.status + ' ' + e.msg + '）' : e && e.status ? '（' + e.status + '）' : '';
    if (e && e.status === 403) {
      if (/registered|developer dashboard/i.test(e.msg || '')) return t('err403user') + m;
      if (/scope/i.test(e.msg || '')) return t('relogin') + m;
      return t('err403') + m;
    }
    if (e && e.status === 401) return t('relogin') + m;
    if (e && e.status === 429) return t('err429') + m;
    return t('none') + m;
  }
  function opError(r) {
    if (/premium/i.test(r.reason)) return ui === 'kr' ? 'Spotify Premium이 필요해요' : '予約・操作には Spotify Premium が必要です';
    if (r.status === 404 || /no_active_device/i.test(r.reason)) return ui === 'kr' ? 'Spotify에서 먼저 재생해 주세요' : 'Spotify で何か再生してから操作してください';
    if (r.status === 401 || r.status === 403) return t('relogin');
    return '(' + r.status + ')';
  }

  // ================= 小道具 =================
  const HANGUL = /[ᄀ-ᇿ㄰-㆏가-힯]/;

  // Lyrics Flow と同じ飾りの番号（日本風は「1234-56」、韓国風は 5 けた）
  function songNo(id, kind) {
    let h = 0;
    for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return (kind || ui) === 'kr' ? String(10000 + (h % 90000)) : (1000 + (h % 9000)) + '-' + String(h % 100).padStart(2, '0');
  }
  const fmt = (ms) => { const s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const smallImg = (imgs) => (imgs && imgs.length ? (imgs.find((i) => i.width && i.width <= 300) || imgs[imgs.length - 1]).url : '');
  const bigImg = (imgs) => (imgs && imgs.length ? imgs[0].url : '');
  function trackOf(x) {
    return { id: x.id, uri: x.uri, name: x.name, artists: (x.artists || []).map((a) => a.name).join(', '), album: x.album ? x.album.name : '',
      art: smallImg(x.album && x.album.images), big: bigImg(x.album && x.album.images), dur: x.duration_ms };
  }

  // 番号で予約できるよう、出てきた曲の番号を覚えておく
  const nos = jget('lf_remote_nos', {});
  function learn(tracks) {
    for (const tr of tracks) {
      const v = { id: tr.id, uri: tr.uri, name: tr.name, artists: tr.artists, art: tr.art, big: tr.big, album: tr.album, dur: tr.dur };
      nos[songNo(tr.id, 'jp').replace('-', '')] = v;
      nos[songNo(tr.id, 'kr')] = v;
    }
    const keys = Object.keys(nos);
    for (let i = 0; i < keys.length - 1200; i++) delete nos[keys[i]];
    store.set('lf_remote_nos', JSON.stringify(nos));
  }

  // 予約の音
  let ac = null;
  function chime() {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const t0 = ac.currentTime;
      const notes = ui === 'kr' ? [[880, 0], [1174.7, .1], [1568, .2]] : [[1046.5, 0], [1318.5, .14]];
      notes.forEach(([f, d]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = ui === 'kr' ? 'triangle' : 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, t0 + d); g.gain.linearRampToValueAtTime(.2, t0 + d + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + d + .5);
        o.connect(g).connect(ac.destination); o.start(t0 + d); o.stop(t0 + d + .55);
      });
    } catch {}
  }
  let toastTimer = 0;

  }

  const mine = new Set(jget('lf_remote_mine', []));
  function remember(id) { mine.add(id); store.set('lf_remote_mine', JSON.stringify([...mine].slice(-200))); }

  // ================= 予約・すぐ演奏・おまかせ =================
  async function reserve(tr, btn, label) {
    if (btn) btn.disabled = true;
    const r = await api('/me/player/queue?uri=' + encodeURIComponent(tr.uri), { method: 'POST' });
    if (btn) btn.disabled = false;
    if (!r.ok) { toast(t('cantReserve'), opError(r), '', true); return false; }
    remember(tr.id);
    if (btn) { btn.classList.add('done'); btn.textContent = '✓'; }
    chime();
    if (navigator.vibrate) navigator.vibrate(30);
    toast(label || t('reserved'), tr.name, t('songNo') + ' ' + songNo(tr.id));
    setTimeout(refreshNow, 600);
    return true;
  }
  async function playNow(tr) {
    const r = await api('/me/player/play', { method: 'PUT', body: { uris: [tr.uri] } });
    if (!r.ok) { toast(t('cantOp'), opError(r), '', true); return; }
    toast(t('played'), tr.name, t('songNo') + ' ' + songNo(tr.id));
    setTimeout(refreshNow, 600);
  }
  async function omakase() {
    let pool = [];
    try { const d = await api('/me/top/tracks?limit=50&time_range=short_term'); pool = ((d && d.items) || []).map(trackOf); } catch {}
    if (!pool.length) { try { const d = await api('/me/player/recently-played?limit=50'); pool = ((d && d.items) || []).map((x) => trackOf(x.track)); } catch {} }
    const fresh = pool.filter((x) => !mine.has(x.id));
    const list = fresh.length ? fresh : pool;
    if (!list.length) { toast(t('noOmakase'), t('noOmakaseSub'), '', true); return; }
    const pick = list[Math.floor(Math.random() * list.length)];
    learn([pick]);
    reserve(pick, null, t('omakaseDone'));
  }

  // ================= 一覧の行 =================

  const stack = [];

    cur = { name, kind, arg, render: () => v.render(arg) };

    history.replaceState(null, '', kind === 'home' ? location.pathname : '#' + name);
  }

  async function runSearch(more) {

  $('#q').addEventListener('change', saveHint);
  $('#qclear').onclick = () => { $('#q').value = ''; runSearch(); };
  $$('[data-mode]').forEach((b) => { b.onclick = () => go(b.dataset.mode, false); });
  function renderHints() {
    const p = $('#findHint'); p.textContent = '';
    const h = jget('lf_remote_hist', []);
    if (!h.length) return;
    p.append(t('findHint') + ' ');
    h.forEach((q) => { const a = document.createElement('button'); a.textContent = q; a.style.cssText = 'margin:2px 4px 2px 0;padding:5px 10px;border-radius:7px;background:rgba(255,255,255,.12);font-size:13px'; markLang(a, q); a.onclick = () => { $('#q').value = q; runSearch(); }; p.append(a); });
  }

  // 50 音（日本風だけ）
  const KROWS = ['あかさたなはまやらわ', 'いきしちにひみ り ', 'うくすつぬふむゆるを', 'えけせてねへめ れ ', 'おこそとのほもよろん'];
  for (let r = 0; r < 5; r++) for (let c = 0; c < 10; c++) {
    const ch = KROWS[r][c] || ' ', b = document.createElement('button');
    if (ch === ' ') b.className = 'blank'; else { b.textContent = ch; b.dataset.k = ch; }
    b.style.gridRow = String(r + 1); b.style.gridColumn = String(c + 1);
    $('#kgrid').appendChild(b);
  }
  const DAKU = { か: 'が', き: 'ぎ', く: 'ぐ', け: 'げ', こ: 'ご', さ: 'ざ', し: 'じ', す: 'ず', せ: 'ぜ', そ: 'ぞ', た: 'だ', ち: 'ぢ', つ: 'づ', て: 'で', と: 'ど', は: 'ば', ひ: 'び', ふ: 'ぶ', へ: 'べ', ほ: 'ぼ', う: 'ゔ' };
  const HANDAKU = { は: 'ぱ', ひ: 'ぴ', ふ: 'ぷ', へ: 'ぺ', ほ: 'ぽ' };
  const SMALL = { あ: 'ぁ', い: 'ぃ', う: 'ぅ', え: 'ぇ', お: 'ぉ', つ: 'っ', や: 'ゃ', ゆ: 'ゅ', よ: 'ょ', わ: 'ゎ' };
  function toggleLast(map) {
    const inp = $('#q'), v = inp.value, last = v.slice(-1);
    const inv = Object.fromEntries(Object.entries(map).map(([a, b]) => [b, a]));
    const to = map[last] || inv[last];
    if (to) { inp.value = v.slice(0, -1) + to; kanaTyped(); }
  }
  function kanaTyped() { clearTimeout(typing); typing = setTimeout(() => { runSearch(); saveHint(); }, 600); }
  $('#kana').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    const inp = $('#q');
    if (b.dataset.k) { inp.value += b.dataset.k; kanaTyped(); }
    else if (b.dataset.fn === 'dakuten') toggleLast(DAKU);
    else if (b.dataset.fn === 'handaku') toggleLast(HANDAKU);
    else if (b.dataset.fn === 'small') toggleLast(SMALL);
    else if (b.dataset.fn === 'back') { inp.value = inp.value.slice(0, -1); kanaTyped(); }
    else if (b.dataset.fn === 'clear') { inp.value = ''; kanaTyped(); }
    if (navigator.vibrate) navigator.vibrate(8);
  });
  function setKana(on) {
    $('#kana').hidden = !on;
    $('#kanaBtn').setAttribute('aria-pressed', String(on));
    $('#q').inputMode = on ? 'none' : 'search';
    store.set('lf_remote_kana', on ? 'on' : 'off');
  }
  $('#kanaBtn').onclick = () => setKana($('#kana').hidden);
  $('#goKana').onclick = () => { if (ui === 'jp') setKana(true); go('song'); };

  // ---------- 一覧 ----------
  let topRange = 'short_term';
  VIEWS.recent = { el: 'v-list', render: () => listView('recent') };
  VIEWS.top = { el: 'v-list', render: () => listView('top') };
  VIEWS.new = { el: 'v-list', render: () => listView('new') };
  VIEWS.genre = { el: 'v-list', render: (g) => listView('genre', g) };
  VIEWS.queue = { el: 'v-list', render: () => listView('queue') };
  VIEWS.book = { el: 'v-list', render: () => listView('book') };
  async function listView(kind, arg) {
    const tabs = $('#listTabs'), box = $('#listBody');
    tabs.textContent = '';
    [['recent', t('recent')], ['top', t('top50')], ['new', t('newSongs')], ['genre:j-pop', 'J-POP'], ['genre:k-pop', 'K-POP'], ['genre:anime', t('anime')], ['genre:vocaloid', t('vocaloid')],
      ['genre:rock', t('rock')], ['genre:hip-hop', t('hiphop')], ['genre:pop', t('western')], ['queue', t('queue')], ['book', t('book')]].forEach(([k, label]) => {
      const b = document.createElement('button'); b.textContent = label;
      b.setAttribute('aria-pressed', String(k === (arg ? kind + ':' + arg : kind)));
      b.onclick = () => go(k, false);
      tabs.appendChild(b);
    });
    tabs.querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
    $('#listInfo').textContent = '';
    loadingIn(box);
    try {
      if (kind === 'book') {
        // 覚えている曲を、いまの画面の番号の順に
        $('#listTitle').textContent = t('bookTitle');
        const seen = new Set();
        const list = Object.values(nos).filter((x) => x && x.id && !seen.has(x.id) && seen.add(x.id))
          .sort((a, b) => songNo(a.id).localeCompare(songNo(b.id)));
        $('#listInfo').textContent = t('hits', { n: list.length });
        const n = document.createElement('p'); n.className = 'hint'; n.textContent = t('bookNote');
        rows(box, list, { empty: t('bookEmpty') });
        box.prepend(n);
        return;
      }
      if (kind === 'recent') {
        $('#listTitle').textContent = t('recentTitle');
        const d = await api('/me/player/recently-played?limit=50');
        const seen = new Set();
        rows(box, ((d && d.items) || []).map((x) => x.track).filter((x) => x && !seen.has(x.id) && seen.add(x.id)).map(trackOf));
      } else if (kind === 'top') {
        $('#listTitle').textContent = t('topTitle');
        const d = await api('/me/top/tracks?limit=50&time_range=' + topRange);
        rows(box, ((d && d.items) || []).map(trackOf));
        const bar = document.createElement('div'); bar.className = 'modes'; bar.style.margin = '0 0 8px';
        [['short_term', t('range4')], ['medium_term', t('range6')], ['long_term', t('range1')]].forEach(([k, label]) => {
          const b = document.createElement('button'); b.textContent = label; b.setAttribute('aria-pressed', String(k === topRange));
          b.onclick = () => { topRange = k; listView('top'); };
          bar.appendChild(b);
        });
        box.prepend(bar);
      } else if (kind === 'new') {
        const y = new Date().getFullYear();
        $('#listTitle').textContent = t('newTitle', { y });
        const d = await api('/search?' + new URLSearchParams({ type: 'track', limit: '40', market: 'from_token', q: 'year:' + y }));
        rows(box, ((d && d.tracks && d.tracks.items) || []).filter(Boolean).map(trackOf));
      } else if (kind === 'genre') {
        $('#listTitle').textContent = t('genreTitle', { g: arg.toUpperCase() });
        const d = await api('/search?' + new URLSearchParams({ type: 'track', limit: '40', market: 'from_token', q: 'genre:"' + arg + '"' }));
        rows(box, ((d && d.tracks && d.tracks.items) || []).filter(Boolean).map(trackOf));
      } else if (kind === 'queue') {
        $('#listTitle').textContent = t('queueTitle');
        const d = await api('/me/player/queue');
        const list = [];
        if (d && d.currently_playing && d.currently_playing.type === 'track') list.push({ ...trackOf(d.currently_playing), current: true });
        ((d && d.queue) || []).filter((x) => x && x.type === 'track').forEach((x, i) => list.push({ ...trackOf(x), pos: i + 1 }));
        $('#listInfo').textContent = t('hits', { n: Math.max(0, list.length - 1) });
        rows(box, list, { queue: true, empty: t('queueEmpty') });
        const n = document.createElement('p'); n.className = 'hint'; n.textContent = t('queueNote'); box.appendChild(n);
      }
    } catch (e) {
      rows(box, [], { empty: whyFailed(e) });
    }
  }

  // ---------- リモコン ----------
  let digits = '';
  VIEWS.pad = { el: 'v-pad', render() { showDigits(); renderNow(); } };
  const padLen = () => (ui === 'kr' ? 5 : 6);
  function showDigits() {
    const n = padLen();
    const d = (digits + '-'.repeat(n)).slice(0, n);
    $('#padNum').textContent = ui === 'kr' ? d : d.slice(0, 4) + '-' + d.slice(4);
    const hit = digits.length === n ? nos[digits] : null;
    $('#padFound').textContent = hit ? hit.name + ' / ' + hit.artists : '';
    markLang($('#padFound'), hit ? hit.name : '');
  }
  $('#keys').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (navigator.vibrate) navigator.vibrate(8);
    if (b.classList.contains('clr')) digits = '';
    else if (b.classList.contains('ok')) {
      const hit = digits.length === padLen() ? nos[digits] : null;
      if (!hit) { toast(t('noNumber'), t('noNumberSub'), '', true); return; }
      reserve(hit).then((ok) => { if (ok) { digits = ''; showDigits(); } });
      return;
    } else if (digits.length < padLen()) digits += b.textContent.trim();
    showDigits();
  });

  // ---------- 曲の詳しい情報 ----------
  let dTrack = null;
  async function openDetail(tr) {
    dTrack = tr;
    $('#dArt').src = tr.big || tr.art || '';
    $('#dTitle').textContent = tr.name; markLang($('#dTitle'), tr.name);
    $('#dArtist').textContent = tr.artists; markLang($('#dArtist'), tr.artists);
    $('#dNo').textContent = t('songNo') + ' ' + songNo(tr.id);
    const chips = $('#dChips'); chips.textContent = '';
    const chip = (text, cls) => { const s = document.createElement('span'); s.textContent = text; if (cls) s.className = cls; markLang(s, text); chips.appendChild(s); return s; };
    if (tr.album) chip(tr.album);
    if (tr.dur) chip(fmt(tr.dur));
    const lc = chip(t('lyricsChecking'), 'no');
    const r = $('#dRsv'); r.classList.remove('done'); r.textContent = t('reserve');
    $('#detail').hidden = false;
    // カラオケで歌えるか（LRCLIB にタイミングつきの歌詞があるか）
    try {
      const q = new URLSearchParams({ track_name: tr.name, artist_name: tr.artists.split(', ')[0], album_name: tr.album || '', duration: String(Math.round((tr.dur || 0) / 1000)) });
      const res = await fetch('https://lrclib.net/api/get?' + q);
      const j = res.ok ? await res.json() : null;
      if (dTrack !== tr) return;
      if (j && j.syncedLyrics) { lc.textContent = t('lyricsSynced'); lc.className = 'ok'; }
      else if (j && j.plainLyrics) { lc.textContent = t('lyricsPlain'); lc.className = ''; }
      else { lc.textContent = t('lyricsNone'); lc.className = 'no'; }
    } catch { if (dTrack === tr) lc.textContent = t('lyricsNone'); }
  }
  function closeDetail() { $('#detail').hidden = true; dTrack = null; }
  $('#dClose').onclick = closeDetail;
  $('#detail').addEventListener('click', (e) => { if (e.target.id === 'detail') closeDetail(); });
  $('#dRsv').onclick = () => dTrack && reserve(dTrack, $('#dRsv'));
  $('#dNow').onclick = () => { if (dTrack) { playNow(dTrack); closeDetail(); } };
  const openHelp = () => { $('#help').hidden = false; };
  $('#helpBtn').onclick = openHelp;
  $('#helpClose').onclick = () => { $('#help').hidden = true; };
  $('#help').addEventListener('click', (e) => { if (e.target.id === 'help') $('#help').hidden = true; });

  // ================= 演奏中と操作 =================
  let player = null, connected = false, polledAt = 0;
  function setConn(on) { connected = on; $('#conn').classList.toggle('on', on); $('#conn span').textContent = on ? t('online') : t('offline'); }
  function renderNow() {
    const it = player && player.item;
    const lb = !it ? t('idle') : player.is_playing ? t('playing') : t('paused');
    const title = it ? it.name : t('idleTitle');
    const ar = it && it.artists ? it.artists.map((a) => a.name).join(', ') : '';
    $('#hLb').textContent = lb; $('#pLb').textContent = lb;
    $('#pTitle').textContent = title; markLang($('#pTitle'), title);
    $('#pArtist').textContent = ar; markLang($('#pArtist'), ar);
    $('#hTitle').textContent = title; markLang($('#hTitle'), title);
    $('#mTitle').textContent = it ? lb + ' ・ ' + title : title; markLang($('#mTitle'), title);
    $('#hArtist').textContent = ar; markLang($('#hArtist'), ar);
    $('#hNo').textContent = it ? t('songNo') + ' ' + songNo(it.id) : '';
    const big = it ? bigImg(it.album && it.album.images) : '', small = it ? smallImg(it.album && it.album.images) : '';
    if ($('#hArt').getAttribute('src') !== big) $('#hArt').src = big;
    if ($('#pArt').getAttribute('src') !== big) $('#pArt').src = big;
    if ($('#mArt').getAttribute('src') !== small) $('#mArt').src = small;
    $('#pauseLbl').textContent = player && player.is_playing ? t('pause') : t('resume');
    tickBar();
  }
  // 再生位置のバー（取得のあいだも進める）
  function tickBar() {
    const it = player && player.item;
    if (!it) { $('#pBar').style.width = '0'; $('#hBar').style.width = '0'; $('#hTime').textContent = '0:00'; $('#hDur').textContent = '0:00'; return; }
    const pos = Math.min(it.duration_ms, (player.progress_ms || 0) + (player.is_playing ? performance.now() - polledAt : 0));
    $('#hBar').style.width = $('#pBar').style.width = (pos / it.duration_ms * 100).toFixed(1) + '%';
    $('#hTime').textContent = fmt(pos); $('#hDur').textContent = fmt(it.duration_ms);
  }
  setInterval(tickBar, 500);
  async function refreshNow() {
    try { player = await api('/me/player?additional_types=track'); polledAt = performance.now(); setConn(true); }
    catch { setConn(false); }
    renderNow();
    if (tvTab === 'next') loadTvNext();
  }
  async function op(method, path, body) {
    const r = await api(path, { method, body });
    if (!r.ok) toast(t('cantOp'), opError(r), '', true);
    setTimeout(refreshNow, 500);
  }
  const seekBy = (d) => { if (!player || !player.item) return; op('PUT', '/me/player/seek?position_ms=' + Math.max(0, (player.progress_ms || 0) + (player.is_playing ? performance.now() - polledAt : 0) + d)); };
  const vol = (d) => { const v = player && player.device && player.device.volume_percent; if (v == null) { toast(t('cantOp'), '', '', true); return; } op('PUT', '/me/player/volume?volume_percent=' + Math.max(0, Math.min(100, v + d))); };
  const OPS = {
    rew: () => seekBy(-10000), ff: () => seekBy(10000), restart: () => op('PUT', '/me/player/seek?position_ms=0'),
    pause: () => op('PUT', player && player.is_playing ? '/me/player/pause' : '/me/player/play'),
    skip: () => op('POST', '/me/player/next'), prev: () => op('POST', '/me/player/previous'),
    volUp: () => vol(10), volDown: () => vol(-10), queue: () => go('queue'),
  };
  $$('[data-op]').forEach((b) => { b.onclick = () => { if (navigator.vibrate) navigator.vibrate(10); OPS[b.dataset.op](); }; });
  $('#dockBack').onclick = back;
  $('#dockTop').onclick = goTop;
  $('#dockRemote').onclick = () => go('pad');
  $('#dockStop').onclick = OPS.skip;
  $('#miniNow').onclick = () => go('pad');
  $('#omakase').onclick = omakase;

  // らくらく（文字を大きく）
  function setEasy(on) { if (on) root.setAttribute('data-easy', ''); else root.removeAttribute('data-easy'); $('#easyBtn').setAttribute('aria-pressed', String(on)); store.set('lf_remote_easy', on ? 'on' : 'off'); }
  $('#easyBtn').onclick = () => setEasy(!root.hasAttribute('data-easy'));

  // 時計
  function clock() { const d = new Date(); $('#clock').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); }
  setInterval(clock, 10000);

  // ================= アプリとして入れる（PWA） =================
  let installEvt = null;
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; if (!standalone) $('#installBtn').hidden = false; });
  $('#installBtn').onclick = async () => {
    if (installEvt) { installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; $('#installBtn').hidden = true; }
    else toast(t('install'), ui === 'kr' ? '공유 버튼 → "홈 화면에 추가"' : '共有ボタン →「ホーム画面に追加」');
  };
  if (!standalone && /iphone|ipad|ipod/i.test(navigator.userAgent)) $('#installBtn').hidden = false;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  // ================= 起動 =================
  $$('[data-go]').forEach((b) => { b.onclick = () => go(b.dataset.go); });
  $('#goTop').onclick = goTop;
  $$('[data-ui-pick]').forEach((b) => { b.onclick = () => setUi(b.dataset.uiPick); });
  addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#detail').hidden) closeDetail(); else if (!$('#help').hidden) $('#help').hidden = true; else back();
  });

  function main() {
    if (!store.get('lf_refresh')) {
      $('#login').hidden = false;
      $('#loginLink').onclick = () => store.set('lf_after_login', '/lyrics/remote/');
      return;
    }
    stage.hidden = false;
    clock();
    setEasy(store.get('lf_remote_easy') === 'on');
    setKana(store.get('lf_remote_kana') === 'on');
    applyUi();
    const h = location.hash.slice(1);
    go(h && VIEWS[h.split(':')[0]] ? h : 'home', false);
    refreshNow();
    setInterval(() => { if (document.visibilityState === 'visible') refreshNow(); }, 5000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refreshNow(); });
  }
  main();
})();
</script>
<script src="/assets/analytics.js" defer></script>
<script src="/assets/maintenance.js" defer></script>
</body>
</html>
