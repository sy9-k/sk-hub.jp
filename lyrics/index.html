<!doctype html>
<html lang="ja" data-theme="glow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lyrics Flow | SK's Lab</title>
<meta name="description" content="Spotify で再生中の曲の歌詞を、再生に合わせてひたすら流し続ける SK's Lab のツール。">
<meta name="theme-color" content="#0b0b0f">
<link rel="canonical" href="https://sk-hub.jp/lyrics/">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<!-- テーマを、画面が出る前に付ける（ちらつかないように） -->
<script>(function(){try{var t=new URLSearchParams(location.search).get("theme")||localStorage.getItem("lf_theme");if(/^(glow|bold|karaoke|simple)$/.test(t))document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
<script src="/assets/fonts.js" data-fonts="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700;900&family=M+PLUS+Rounded+1c:wght@800&display=swap"></script>
<style>
  :root {
    --bg: #0b0b0f;
    --fg: #ffffff;
    --size: 36px;
    --c1: #5b4bff;  /* ジャケットから取った色（取れなければこのまま） */
    --c2: #ff4f8b;
    --c3: #1fb5ff;
    --solid: #4a3a8c;
    --anchor: 50%;   /* いまの行を置く高さ */
    --ease: cubic-bezier(.2, .75, .2, 1);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: "Noto Sans JP", system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif;
  }
  body { transition: background-color 1.2s; }
  body.idle { cursor: none; }

  /* ================= 背景 ================= */
  #bg {
    position: fixed; inset: -10%; z-index: 0;
    background-size: cover; background-position: center;
    filter: blur(70px) brightness(.4) saturate(1.4);
  }
  #glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; display: none; background: #000; }
  #glow .blob {
    position: absolute; width: 85vmax; height: 85vmax; border-radius: 50%;
    filter: blur(90px); opacity: .8;
    transition: background-color 1.5s;
    animation: drift 26s ease-in-out infinite alternate;
  }
  #glow .b1 { background: var(--c1); left: -25vmax; top: -30vmax; }
  #glow .b2 { background: var(--c2); right: -30vmax; top: 5vmax; animation-duration: 32s; animation-direction: alternate-reverse; }
  #glow .b3 { background: var(--c3); left: 5vmax; bottom: -45vmax; animation-duration: 38s; }
  #glow::after { content: ""; position: absolute; inset: 0; background: rgba(0, 0, 0, .28); }
  @keyframes drift {
    0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
    50%  { transform: translate(14vmax, 8vmax) rotate(140deg) scale(1.18); }
    100% { transform: translate(-8vmax, 16vmax) rotate(260deg) scale(.92); }
  }

  /* ================= 歌詞（一覧で流すテーマ） ================= */
  #stage {
    position: fixed; inset: 0; z-index: 1; overflow: hidden;
    /* 上はヘッダーの下で消える・下はフッターの手前で消える */
    -webkit-mask-image: linear-gradient(transparent 90px, #000 calc(90px + 12%), #000 82%, transparent calc(100% - 40px));
            mask-image: linear-gradient(transparent 90px, #000 calc(90px + 12%), #000 82%, transparent calc(100% - 40px));
  }
  #lines { position: absolute; left: 0; right: 0; top: var(--anchor); padding: 0 7vw; }
  #lines.plain { will-change: transform; }
  .line {
    padding: .3em 0;
    font-size: var(--size); font-weight: 800; line-height: 1.32;
    overflow-wrap: anywhere;
    transition: transform .7s var(--ease);
    will-change: transform;
  }
  .line .txt {
    display: inline-block; transform-origin: left center;
    color: rgba(255, 255, 255, .38);
    transition: color .4s, transform .5s var(--ease), filter .5s, opacity .5s, text-shadow .5s;
  }
  .line.past .txt { color: rgba(255, 255, 255, .2); }
  .line.active .txt { color: var(--fg); }
  .line.note .txt { letter-spacing: .3em; }
  #lines.plain .line .txt { color: var(--fg); }

  /* --- シンプル --- */
  [data-theme="simple"] .line .txt { filter: blur(.4px); }
  [data-theme="simple"] .line.active .txt { transform: scale(1.05); filter: none; }

  /* --- グロー（Apple Music 風）: 色が動く背景・離れた行ほどぼかす・ばねのように少しずつ遅れて動く --- */
  [data-theme="glow"] #glow { display: block; }
  [data-theme="glow"] #bg { display: none; }
  [data-theme="glow"] { --anchor: 36%; }
  [data-theme="glow"] .line { font-weight: 900; letter-spacing: -.01em; transition: transform .95s cubic-bezier(.3, 1.22, .45, 1); }
  [data-theme="glow"] .line .txt { color: rgba(255, 255, 255, .42); transform: scale(.96); }
  [data-theme="glow"] .line[data-d="1"] .txt { filter: blur(.8px); }
  [data-theme="glow"] .line[data-d="2"] .txt { filter: blur(1.6px); }
  [data-theme="glow"] .line[data-d="3"] .txt { filter: blur(2.4px); opacity: .85; }
  [data-theme="glow"] .line[data-d="4"] .txt { filter: blur(3.2px); opacity: .7; }
  [data-theme="glow"] .line.past .txt { color: rgba(255, 255, 255, .32); }
  [data-theme="glow"] .line.active .txt {
    color: #fff; transform: scale(1); filter: none; opacity: 1;
    text-shadow: 0 0 28px rgba(255, 255, 255, .45);
  }
  [data-theme="glow"] header { background: none; }

  /* --- ボールド（Spotify 風）: ジャケットの色をベタ塗り・歌った行は白、これからの行は黒 --- */
  [data-theme="bold"] body { background: var(--solid); }
  [data-theme="bold"] #bg { display: none; }
  [data-theme="bold"] { --anchor: 32%; }
  [data-theme="bold"] .line { font-weight: 900; letter-spacing: -.015em; line-height: 1.25; padding: .32em 0; }
  [data-theme="bold"] .line .txt { color: rgba(0, 0, 0, .78); transition: color .25s; }
  [data-theme="bold"] .line.past .txt { color: rgba(255, 255, 255, .62); }
  [data-theme="bold"] .line.active .txt { color: #fff; }
  [data-theme="bold"] #lines.plain .line .txt { color: #fff; }
  [data-theme="bold"] header { background: linear-gradient(var(--solid) 40%, transparent); }
  [data-theme="bold"] footer { background: linear-gradient(transparent, var(--solid) 60%); }

  /* ================= カラオケ ================= */
  #karaoke { position: fixed; inset: 0; z-index: 1; display: none; pointer-events: none; }
  [data-theme="karaoke"][data-mode="synced"] #karaoke { display: block; }
  [data-theme="karaoke"][data-mode="synced"] #stage { display: none; }
  [data-theme="karaoke"] #bg { filter: blur(40px) brightness(.35) saturate(1.5); }
  .krow { position: absolute; left: 5vw; right: 5vw; }
  .krow.r0 { bottom: calc(14% + var(--size) * 2.4); text-align: left; }
  .krow.r1 { bottom: 12%; text-align: right; }
  .kline {
    position: relative; display: inline-block; white-space: nowrap;
    font-family: "M PLUS Rounded 1c", "Noto Sans JP", system-ui, sans-serif;
    font-weight: 800; font-size: calc(var(--size) * 1.45); line-height: 1.3;
    letter-spacing: .04em;
  }
  .kline.enter { animation: kin .35s var(--ease); }
  @keyframes kin { from { opacity: 0; transform: translateY(.3em); } to { opacity: 1; transform: none; } }
  .kline .base, .kline .fill { display: block; padding: 0 .12em; }
  .kline .base {
    color: #fff;
    text-shadow:
      3px 0 0 #102a6b, -3px 0 0 #102a6b, 0 3px 0 #102a6b, 0 -3px 0 #102a6b,
      2px 2px 0 #102a6b, -2px 2px 0 #102a6b, 2px -2px 0 #102a6b, -2px -2px 0 #102a6b,
      0 6px 14px rgba(0, 0, 0, .5);
  }
  .kline .fill {
    position: absolute; inset: 0;
    color: #2f8dff;
    text-shadow:
      3px 0 0 #fff, -3px 0 0 #fff, 0 3px 0 #fff, 0 -3px 0 #fff,
      2px 2px 0 #fff, -2px 2px 0 #fff, 2px -2px 0 #fff, -2px -2px 0 #fff;
    clip-path: inset(-30% calc(100% - var(--p, 0) * 100%) -30% -30%);
  }
  #ktitle {
    position: absolute; left: 0; right: 0; top: 30%; text-align: center; padding: 0 6vw;
    transition: opacity .6s; opacity: 0;
  }
  #ktitle.show { opacity: 1; }
  #ktitle .kt-name {
    font-family: "M PLUS Rounded 1c", "Noto Sans JP", sans-serif; font-weight: 800;
    font-size: calc(var(--size) * 1.7); line-height: 1.2;
    text-shadow: 0 0 0 transparent, 3px 3px 0 #102a6b, -3px 3px 0 #102a6b, 3px -3px 0 #102a6b, -3px -3px 0 #102a6b;
  }
  #ktitle .kt-artist { margin-top: .6em; font-size: calc(var(--size) * .7); font-weight: 700; color: #ffd84d; }
  #ktitle .kt-bar { width: 40%; height: 3px; margin: .8em auto; background: linear-gradient(90deg, transparent, #ffd84d, transparent); }

  #message {
    position: fixed; inset: 0; z-index: 2;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 24px; font-size: 20px; color: rgba(255, 255, 255, .5); pointer-events: none;
  }

  @media (prefers-reduced-motion: reduce) {
    #glow .blob { animation: none; }
    .line, .line .txt { transition-duration: .01s !important; }
  }

  /* ================= ヘッダー / フッター ================= */
  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    background: linear-gradient(rgba(0, 0, 0, .55), transparent);
    transition: opacity .5s;
  }
  body.idle header, body.idle footer { opacity: 0; }
  body.idle #themePanel { opacity: 0; pointer-events: none; }
  #art { width: 52px; height: 52px; border-radius: 6px; object-fit: cover; background: #222; flex: none; box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  #art[src=""] { visibility: hidden; }
  #meta { min-width: 0; flex: 1; }
  #title  { font-weight: 700; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #artist { font-size: 14px; color: rgba(255, 255, 255, .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .controls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  button {
    font: inherit; font-size: 13px; color: var(--fg); cursor: pointer;
    background: rgba(255, 255, 255, .14); border: 0; border-radius: 999px; padding: 7px 12px;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  button:hover { background: rgba(255, 255, 255, .24); }
  button.primary { background: #1ed760; color: #000; font-weight: 700; padding: 12px 22px; font-size: 15px; }
  #themeBtn { font-weight: 700; }
  #offsetLabel { font-size: 12px; color: rgba(255, 255, 255, .6); align-self: center; min-width: 64px; text-align: center; }

  footer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
    padding: 12px 20px 16px; transition: opacity .5s;
    display: flex; align-items: center; gap: 10px; font-size: 12px; color: rgba(255, 255, 255, .6);
  }
  #bar { flex: 1; height: 4px; background: rgba(255, 255, 255, .18); border-radius: 2px; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: var(--fg); }
  #source { white-space: nowrap; }

  /* ================= テーマの選択 ================= */
  #themePanel {
    position: fixed; top: 78px; right: 20px; z-index: 4;
    width: min(420px, calc(100vw - 32px));
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px;
    background: rgba(20, 20, 26, .72); border: 1px solid rgba(255, 255, 255, .1); border-radius: 18px;
    -webkit-backdrop-filter: blur(24px) saturate(1.4); backdrop-filter: blur(24px) saturate(1.4);
    box-shadow: 0 20px 60px rgba(0, 0, 0, .45);
    transition: opacity .3s;
  }
  #themePanel[hidden] { display: none; }
  .tp {
    display: flex; flex-direction: column; align-items: stretch; gap: 8px; text-align: left;
    padding: 8px; border-radius: 12px; background: rgba(255, 255, 255, .06);
    -webkit-backdrop-filter: none; backdrop-filter: none;
    outline: 2px solid transparent; outline-offset: -2px;
  }
  .tp[aria-pressed="true"] { outline-color: #fff; background: rgba(255, 255, 255, .12); }
  .tp b { font-size: 14px; padding: 0 2px; }
  .tp small { font-size: 11px; color: rgba(255, 255, 255, .55); padding: 0 2px 2px; }
  .sw {
    height: 74px; border-radius: 8px; overflow: hidden; position: relative;
    display: flex; flex-direction: column; justify-content: center; gap: 5px; padding: 0 10px;
    font-weight: 900; font-size: 12px; line-height: 1.1;
  }
  .sw i { font-style: normal; display: block; white-space: nowrap; }
  .sw-glow { background: radial-gradient(circle at 20% 20%, #ff4f8b, transparent 60%), radial-gradient(circle at 80% 40%, #5b4bff, transparent 60%), radial-gradient(circle at 40% 100%, #1fb5ff, #111 70%); }
  .sw-glow i { color: rgba(255,255,255,.4); filter: blur(.8px); }
  .sw-glow i.on { color: #fff; filter: none; text-shadow: 0 0 10px rgba(255,255,255,.6); }
  .sw-bold { background: #b8452f; }
  .sw-bold i { color: rgba(0,0,0,.8); }
  .sw-bold i.on { color: #fff; }
  .sw-karaoke { background: linear-gradient(#1a1440, #0d2a4a); justify-content: flex-end; padding-bottom: 10px; font-family: "M PLUS Rounded 1c", sans-serif; }
  .sw-karaoke i { color: #fff; text-shadow: 1px 0 #102a6b, -1px 0 #102a6b, 0 1px #102a6b, 0 -1px #102a6b; }
  .sw-karaoke i.on { background: linear-gradient(90deg, #2f8dff 55%, #fff 55%); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
  .sw-karaoke i.r { text-align: right; }
  .sw-simple { background: #0b0b0f; }
  .sw-simple i { color: rgba(255,255,255,.35); }
  .sw-simple i.on { color: #fff; }

  /* ================= セットアップ画面 ================= */
  #setup {
    position: fixed; inset: 0; z-index: 10; overflow: auto;
    display: flex; align-items: center; justify-content: center; padding: 16px;
    background: var(--bg);
  }
  #setup[hidden] { display: none; }
  .card { width: 100%; max-width: 560px; }
  .card h1 { font-size: 30px; margin: 0 0 6px; }
  .card p, .card li { color: #bbb; line-height: 1.7; font-size: 14px; }
  .card ol { padding-left: 20px; }
  .card code { background: #222; padding: 2px 6px; border-radius: 4px; color: #fff; word-break: break-all; }
  .card input {
    width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; margin: 8px 0 16px;
    background: #1a1a20; color: #fff; border: 1px solid #333; border-radius: 8px;
  }
  .card label { font-size: 13px; color: #999; }
  .err { color: #ff6b6b; font-size: 14px; min-height: 1.4em; }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; }
    .controls { width: 100%; justify-content: flex-start; }
    #themePanel { top: auto; bottom: 56px; right: 16px; }
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="glow"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<div id="stage"><div id="lines"></div></div>

<div id="karaoke">
  <div id="ktitle"><div class="kt-name"></div><div class="kt-bar"></div><div class="kt-artist"></div></div>
  <div class="krow r0"><div class="kline"><span class="base"></span><span class="fill"></span></div></div>
  <div class="krow r1"><div class="kline"><span class="base"></span><span class="fill"></span></div></div>
</div>

<div id="message"></div>

<header>
  <img id="art" src="" alt="">
  <div id="meta">
    <div id="title">—</div>
    <div id="artist"></div>
  </div>
  <div class="controls">
    <button id="themeBtn" title="見た目を選ぶ ( T )" aria-expanded="false">テーマ</button>
    <button id="offMinus" title="歌詞を早める ( [ )">−0.25s</button>
    <span id="offsetLabel">±0.00s</span>
    <button id="offPlus" title="歌詞を遅らせる ( ] )">+0.25s</button>
    <button id="smaller" title="文字を小さく ( - )">A−</button>
    <button id="bigger" title="文字を大きく ( + )">A+</button>
    <button id="fs" title="全画面 ( F )">全画面</button>
    <button id="logout">ログアウト</button>
  </div>
</header>

<div id="themePanel" hidden>
  <button class="tp" data-pick="glow">
    <span class="sw sw-glow"><i>ゆらめく光の中で</i><i class="on">いまの行が輝く</i><i>次の行はぼやけて</i></span>
    <b>グロー</b><small>Apple Music 風・色が動く背景</small>
  </button>
  <button class="tp" data-pick="bold">
    <span class="sw sw-bold"><i class="on">歌った行は白く</i><i>これからの行は黒</i><i>ジャケットの色で</i></span>
    <b>ボールド</b><small>Spotify 風・ベタ塗りの背景</small>
  </button>
  <button class="tp" data-pick="karaoke">
    <span class="sw sw-karaoke"><i class="on">左から色が変わる</i><i class="r">次の行はこちら</i></span>
    <b>カラオケ</b><small>2 行表示・左から色が変わる</small>
  </button>
  <button class="tp" data-pick="simple">
    <span class="sw sw-simple"><i>すっきりした</i><i class="on">シンプルな見た目</i><i>黒い背景</i></span>
    <b>シンプル</b><small>ジャケットをぼかした背景</small>
  </button>
</div>

<footer>
  <span id="time">0:00</span>
  <div id="bar"><div id="barFill"></div></div>
  <span id="dur">0:00</span>
  <span id="source"></span>
</footer>

<section id="setup" hidden>
  <div class="card">
    <h1>Lyrics Flow</h1>
    <p>Spotifyで再生中の曲の歌詞を、再生に合わせてひたすら流し続けます。</p>
    <div id="ownApp">
    <ol>
      <li><a href="https://developer.spotify.com/dashboard" target="_blank" rel="noopener" style="color:#1ed760">Spotify Developer Dashboard</a> でアプリを作成</li>
      <li>Redirect URI に次を登録：<br><code id="redirectShow"></code></li>
      <li>「Web API」にチェックして保存し、Client ID をここに貼り付け</li>
    </ol>
    <label for="clientId">Client ID</label>
    <input id="clientId" placeholder="例: 1a2b3c4d5e6f..." autocomplete="off" spellcheck="false">
    </div>
    <button class="primary" id="login">Spotifyでログイン</button>
    <p class="err" id="setupErr"></p>
    <p style="font-size:12px;color:#777">歌詞は <a href="https://lrclib.net" target="_blank" rel="noopener" style="color:#aaa">LRCLIB</a> から読み込みます。Spotify の歌詞とは別のデータなので、見つからない曲やずれている曲もあります。<br><a href="/lab/" style="color:#aaa">SK's Lab に戻る</a></p>
  </div>
</section>

<script>
(() => {
  'use strict';

  // ================= 設定 =================
  // Spotify Developer Dashboard で作ったアプリの Client ID（公開してよい値）。
  // 空のときは、使う人が自分の Client ID を入力する画面を出す
  const BUILTIN_CLIENT_ID = '';
  const REDIRECT_URI = location.origin + location.pathname;
  const SCOPES = 'user-read-currently-playing user-read-playback-state';
  const POLL_PLAYING_MS = 2000;
  const POLL_IDLE_MS = 5000;
  const THEMES = ['glow', 'bold', 'karaoke', 'simple'];

  const $ = (s) => document.querySelector(s);
  const root = document.documentElement;
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };

  // ================= 状態 =================
  const state = {
    track: null,          // { id, name, artists[], album, duration, art }
    progressMs: 0,        // 最後に取得した再生位置
    syncedAt: 0,          // progressMs を取得した performance.now()
    playing: false,
    lyrics: null,         // { type: 'synced'|'plain'|'instrumental'|'none', lines: [{t, text}] }
    karaoke: [],          // カラオケ用: 文字のある行だけ { t, end, text }
    activeIndex: -1,
    kShown: [null, null], // カラオケの上下の行に出している行の番号
    offsetMs: Number(store.get('lf_offset')) || 0,
    fontSize: Number(store.get('lf_size')) || 36,
  };
  const lyricsCache = new Map();
  const theme = () => root.getAttribute('data-theme');

  // ================= Spotify 認証 (PKCE) =================
  const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
  function randomString(n) {
    const a = crypto.getRandomValues(new Uint8Array(n));
    return Array.from(a, (b) => CHARS[b % CHARS.length]).join('');
  }
  async function sha256base64url(str) {
    const hash = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return btoa(String.fromCharCode(...new Uint8Array(hash)))
      .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function login() {
    const clientId = BUILTIN_CLIENT_ID || $('#clientId').value.trim();
    if (!clientId) { $('#setupErr').textContent = 'Client ID を入力してください'; return; }
    store.set('lf_client_id', clientId);
    const verifier = randomString(64);
    const st = randomString(16);
    store.set('lf_verifier', verifier);
    store.set('lf_state', st);
    const params = new URLSearchParams({
      response_type: 'code',
      client_id: clientId,
      scope: SCOPES,
      redirect_uri: REDIRECT_URI,
      code_challenge_method: 'S256',
      code_challenge: await sha256base64url(verifier),
      state: st,
    });
    location.href = 'https://accounts.spotify.com/authorize?' + params;
  }

  async function tokenRequest(body) {
    const res = await fetch('https://accounts.spotify.com/api/token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error_description || json.error || 'token error ' + res.status);
    store.set('lf_access', json.access_token);
    store.set('lf_expires', String(Date.now() + json.expires_in * 1000));
    if (json.refresh_token) store.set('lf_refresh', json.refresh_token);
    return json.access_token;
  }

  async function handleCallback() {
    const q = new URLSearchParams(location.search);
    if (!q.has('code') && !q.has('error')) return;
    history.replaceState(null, '', REDIRECT_URI);
    if (q.get('error')) throw new Error('認証がキャンセルされました: ' + q.get('error'));
    if (q.get('state') !== store.get('lf_state')) throw new Error('state が一致しません。もう一度ログインしてください。');
    await tokenRequest({
      grant_type: 'authorization_code',
      code: q.get('code'),
      redirect_uri: REDIRECT_URI,
      client_id: store.get('lf_client_id'),
      code_verifier: store.get('lf_verifier'),
    });
    store.del('lf_verifier');
    store.del('lf_state');
  }

  let refreshing = null;
  function refreshToken() {
    if (!refreshing) {
      refreshing = tokenRequest({
        grant_type: 'refresh_token',
        refresh_token: store.get('lf_refresh'),
        client_id: store.get('lf_client_id'),
      }).finally(() => { refreshing = null; });
    }
    return refreshing;
  }

  async function getToken() {
    const exp = Number(store.get('lf_expires')) || 0;
    if (Date.now() > exp - 60_000) return refreshToken();
    return store.get('lf_access');
  }

  function logout() {
    ['lf_access', 'lf_refresh', 'lf_expires'].forEach(store.del);
    location.reload();
  }

  async function spotify(path, retried = false) {
    const token = await getToken();
    const res = await fetch('https://api.spotify.com/v1' + path, {
      headers: { Authorization: 'Bearer ' + token },
    });
    if (res.status === 401 && !retried) { await refreshToken(); return spotify(path, true); }
    if (res.status === 429) {
      const wait = (Number(res.headers.get('Retry-After')) || 5) * 1000;
      const err = new Error('rate limited'); err.retryAfter = wait; throw err;
    }
    if (res.status === 204) return null;
    if (!res.ok) throw new Error('Spotify API ' + res.status);
    return res.json();
  }

  // ================= 再生状態のポーリング =================
  async function poll() {
    let delay = POLL_IDLE_MS;
    try {
      const data = await spotify('/me/player/currently-playing?additional_types=track');
      const item = data && data.item;
      if (!item || item.type !== 'track') {
        state.playing = false;
        if (!item) showMessage('Spotifyで曲を再生してください');
        else showMessage('この再生中のコンテンツには対応していません');
      } else {
        state.progressMs = data.progress_ms || 0;
        state.syncedAt = performance.now();
        state.playing = !!data.is_playing;
        if (!state.track || state.track.id !== item.id) {
          onTrackChange({
            id: item.id,
            name: item.name,
            artists: item.artists.map((a) => a.name),
            album: item.album ? item.album.name : '',
            duration: item.duration_ms,
            art: item.album && item.album.images[0] ? item.album.images[0].url : '',
          });
        }
        delay = state.playing ? POLL_PLAYING_MS : POLL_IDLE_MS;
      }
    } catch (e) {
      console.error(e);
      delay = e.retryAfter || POLL_IDLE_MS;
      if (/token|refresh/i.test(e.message)) { showMessage('再ログインが必要です'); setTimeout(logout, 1500); return; }
    }
    setTimeout(poll, delay);
  }

  async function onTrackChange(track) {
    state.track = track;
    state.lyrics = null;
    state.karaoke = [];
    state.activeIndex = -1;
    $('#title').textContent = track.name;
    $('#artist').textContent = track.artists.join(', ');
    $('#art').src = track.art;
    $('#bg').style.backgroundImage = track.art ? `url("${track.art}")` : 'none';
    $('#ktitle .kt-name').textContent = track.name;
    $('#ktitle .kt-artist').textContent = track.artists.join(', ');
    $('#dur').textContent = fmt(track.duration);
    $('#lines').innerHTML = '';
    $('#source').textContent = '';
    root.removeAttribute('data-mode');
    showMessage('歌詞を検索中…');
    if (track.art) applyColors(track.art);

    let lyrics;
    try {
      lyrics = await loadLyrics(track);
    } catch (e) {
      console.error(e);
      lyrics = { type: 'none', lines: [] };
    }
    if (!state.track || state.track.id !== track.id) return; // 取得中に曲が変わった
    state.lyrics = lyrics;
    renderLyrics();
  }

  // ================= ジャケットの色 =================
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), l = (max + min) / 2;
    if (max === min) return [0, 0, l];
    const d = max - min;
    const s = l > .5 ? d / (2 - max - min) : d / (max + min);
    const h = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }
  const hsl = (h, s, l) => `hsl(${Math.round(h)} ${Math.round(s * 100)}% ${Math.round(l * 100)}%)`;

  function applyColors(url) {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      let data;
      try {
        const c = document.createElement('canvas');
        c.width = c.height = 32;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.drawImage(img, 0, 0, 32, 32);
        data = x.getImageData(0, 0, 32, 32).data;
      } catch { return; } // 画像の読み込みが許されないときは、いまの色のまま
      // 色相を 12 に分けて、鮮やかさで重みを付けて数える
      const buckets = Array.from({ length: 12 }, () => ({ w: 0, h: 0, s: 0, l: 0 }));
      let gray = 0;
      for (let i = 0; i < data.length; i += 4) {
        const [h, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
        const w = s * (1 - Math.abs(l - .5) * 1.7);
        if (w <= .05) { gray++; continue; }
        const b = buckets[Math.floor(h / 30) % 12];
        b.w += w; b.h += h * w; b.s += s * w; b.l += l * w;
      }
      const top = buckets.filter((b) => b.w > 0).sort((a, b) => b.w - a.w)
        .map((b) => ({ h: b.h / b.w, s: b.s / b.w, l: b.l / b.w }));
      if (!top.length || gray > 900) {
        // ほぼ白黒のジャケット
        root.style.setProperty('--c1', '#6b6b78');
        root.style.setProperty('--c2', '#3a3a44');
        root.style.setProperty('--c3', '#9a9aa8');
        root.style.setProperty('--solid', '#3d3d45');
        return;
      }
      const pick = (i) => top[Math.min(i, top.length - 1)];
      const a = pick(0), b = pick(1), c = pick(2);
      root.style.setProperty('--c1', hsl(a.h, Math.min(1, a.s * 1.1), .5));
      root.style.setProperty('--c2', hsl(b.h, Math.min(1, b.s * 1.1), .45));
      root.style.setProperty('--c3', hsl(c.h, Math.min(1, c.s * 1.1), .55));
      // ボールド: 白い文字も黒い文字も読める明るさにそろえる
      root.style.setProperty('--solid', hsl(a.h, Math.min(.6, Math.max(.35, a.s)), .42));
    };
    img.src = url;
  }

  // ================= 歌詞取得 (LRCLIB) =================
  function cleanTitle(name) {
    return name
      .replace(/\s*[-–]\s*(.*remaster.*|.*version.*|.*mix.*|.*edit.*|live.*|mono|stereo)$/i, '')
      .replace(/\s*[\(\[](feat\.?|ft\.?|with)\s[^\)\]]*[\)\]]/ig, '')
      .trim();
  }

  async function lrclib(path, params) {
    const res = await fetch('https://lrclib.net/api/' + path + '?' + new URLSearchParams(params));
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('LRCLIB ' + res.status);
    return res.json();
  }

  function toLyrics(rec) {
    if (!rec) return null;
    if (rec.syncedLyrics) return { type: 'synced', lines: parseLRC(rec.syncedLyrics) };
    if (rec.plainLyrics) return { type: 'plain', lines: rec.plainLyrics.split(/\r?\n/).map((text) => ({ t: 0, text: text.trim() })) };
    if (rec.instrumental) return { type: 'instrumental', lines: [] };
    return null;
  }

  async function loadLyrics(track) {
    if (lyricsCache.has(track.id)) return lyricsCache.get(track.id);
    const durSec = Math.round(track.duration / 1000);
    let result = null;

    // 1) 曲名・アーティスト・アルバム・長さで完全一致検索
    try {
      result = toLyrics(await lrclib('get', {
        track_name: track.name, artist_name: track.artists[0],
        album_name: track.album, duration: durSec,
      }));
    } catch (e) { console.warn(e); }

    // 2) あいまい検索 → 長さが近いもの優先、同期歌詞優先
    if (!result || result.type !== 'synced') {
      const queries = [
        { track_name: track.name, artist_name: track.artists[0] },
        { track_name: cleanTitle(track.name), artist_name: track.artists[0] },
        { q: cleanTitle(track.name) + ' ' + track.artists[0] },
      ];
      for (const q of queries) {
        const list = await lrclib('search', q).catch(() => null);
        if (!list || !list.length) continue;
        const near = list.filter((x) => Math.abs((x.duration || 0) - durSec) <= 3);
        const pool = near.length ? near : list;
        const best = pool.find((x) => x.syncedLyrics) || pool.find((x) => x.plainLyrics) || pool.find((x) => x.instrumental);
        const found = toLyrics(best);
        if (found && (!result || found.type === 'synced')) result = found;
        if (result && result.type === 'synced') break;
      }
    }

    result = result || { type: 'none', lines: [] };
    lyricsCache.set(track.id, result);
    return result;
  }

  function parseLRC(text) {
    const out = [];
    for (const raw of text.split(/\r?\n/)) {
      const tags = [...raw.matchAll(/\[(\d+):(\d+(?:\.\d+)?)\]/g)];
      if (!tags.length) continue;
      const lineText = raw.replace(/\[[^\]]*\]/g, '').trim();
      for (const m of tags) out.push({ t: (Number(m[1]) * 60 + Number(m[2])) * 1000, text: lineText });
    }
    return out.sort((a, b) => a.t - b.t);
  }

  // カラオケ用: 文字のある行だけにして、それぞれの行が終わる時刻（次の行の時刻）を付ける
  function toKaraoke(lines) {
    const out = [];
    lines.forEach((l, i) => {
      if (!l.text) return;
      const next = lines[i + 1] ? lines[i + 1].t : l.t + 6000;
      // 行のあとに長い間奏があるときは、文字数から歌い終わりを見積もる
      const est = Math.max(1800, [...l.text].length * 320);
      out.push({ t: l.t, end: l.t + Math.min(next - l.t, est) * .96, text: l.text });
    });
    return out;
  }

  // ================= 描画 =================
  function showMessage(msg) {
    $('#message').textContent = msg || '';
  }

  function renderLyrics() {
    const el = $('#lines');
    const { type, lines } = state.lyrics;
    el.className = type === 'plain' ? 'plain' : '';
    el.style.transform = '';
    el.innerHTML = '';
    if (type === 'synced' || type === 'plain') root.setAttribute('data-mode', type);
    $('#source').textContent = {
      synced: '同期歌詞 · LRCLIB', plain: '非同期歌詞 · LRCLIB', instrumental: '', none: '',
    }[type];

    if (type === 'instrumental') { showMessage('♪ インストゥルメンタル ♪'); return; }
    if (type === 'none' || !lines.length) { showMessage('歌詞が見つかりませんでした'); return; }
    showMessage('');

    const frag = document.createDocumentFragment();
    for (const l of lines) {
      const d = document.createElement('div');
      const s = document.createElement('span');
      d.className = 'line';
      s.className = 'txt';
      if (!l.text) { s.textContent = '♪'; d.classList.add('note'); }
      else s.textContent = l.text;
      d.appendChild(s);
      frag.appendChild(d);
    }
    el.appendChild(frag);
    state.karaoke = type === 'synced' ? toKaraoke(lines) : [];
    state.kShown = [null, null];
    state.activeIndex = -1;
  }

  function currentMs() {
    const elapsed = state.playing ? performance.now() - state.syncedAt : 0;
    return state.progressMs + elapsed + state.offsetMs;
  }

  function findIndex(lines, ms) {
    let lo = 0, hi = lines.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (lines[mid].t <= ms) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  // 一覧で流すテーマ: 行ごとに動かす（グローは、いまの行より下の行ほど少し遅れて動く）
  function layoutLines(idx) {
    const children = $('#lines').children;
    if (!children.length) return;
    const target = children[Math.max(idx, 0)];
    const y = target.offsetTop + target.offsetHeight / 2;
    const stagger = theme() === 'glow';
    for (let i = 0; i < children.length; i++) {
      const c = children[i];
      c.classList.toggle('active', i === idx);
      c.classList.toggle('past', i < idx);
      c.dataset.d = String(Math.min(Math.abs(i - Math.max(idx, 0)), 4));
      c.style.transitionDelay = stagger ? Math.max(0, Math.min(i - idx + 1, 8)) * 45 + 'ms' : '0ms';
      c.style.transform = `translateY(${-y}px)`;
    }
  }

  // カラオケ: 上の段と下の段に交互に行を出し、歌っている行を左から塗っていく
  function renderKaraoke(ms) {
    const k = state.karaoke;
    const rows = document.querySelectorAll('#karaoke .kline');
    const title = $('#ktitle');
    if (!k.length) { title.classList.remove('show'); return; }

    let d = Math.max(0, findIndex(k, ms));
    // 歌い終わってから次の行まで間があるときは、次の行を先に出しておく
    if (ms >= k[d].t && ms > k[d].end + 800 && d + 1 < k.length) d++;
    const before = ms < k[0].t - 3000;
    title.classList.toggle('show', ms < k[0].t - 1500);

    for (const r of [0, 1]) {
      // 段 r には、d と d+1 のうち番号の偶奇が合う方を出す
      const n = (d % 2 === r) ? d : d + 1;
      const row = rows[r];
      const show = !before && n < k.length;
      row.style.visibility = show ? 'visible' : 'hidden';
      if (!show) { state.kShown[r] = null; continue; }
      if (state.kShown[r] !== n) {
        state.kShown[r] = n;
        row.querySelector('.base').textContent = k[n].text;
        row.querySelector('.fill').textContent = k[n].text;
        fitKaraoke(row);
        row.classList.remove('enter');
        void row.offsetWidth;
        row.classList.add('enter');
      }
      const line = k[n];
      const p = Math.max(0, Math.min(1, (ms - line.t) / (line.end - line.t)));
      row.style.setProperty('--p', p.toFixed(4));
    }
  }

  // 画面の幅に入りきらない行は、文字を小さくする
  function fitKaraoke(row) {
    row.style.fontSize = '';
    const max = innerWidth * .9;
    const w = row.scrollWidth;
    if (w > max) {
      const size = parseFloat(getComputedStyle(row).fontSize);
      row.style.fontSize = (size * max / w) + 'px';
    }
  }

  function frame() {
    requestAnimationFrame(frame);
    if (!state.track) return;
    const ms = Math.max(0, Math.min(currentMs(), state.track.duration));
    $('#time').textContent = fmt(ms - state.offsetMs);
    $('#barFill').style.width = (ms / state.track.duration * 100).toFixed(2) + '%';

    const ly = state.lyrics;
    if (!ly || !ly.lines.length) return;

    if (ly.type === 'synced') {
      if (theme() === 'karaoke') { renderKaraoke(ms); return; }
      const idx = findIndex(ly.lines, ms);
      if (idx === state.activeIndex) return;
      state.activeIndex = idx;
      layoutLines(idx);
    } else {
      // 非同期歌詞: 曲の長さに合わせて一定速度でひたすら流す
      const el = $('#lines');
      el.style.transform = `translateY(${-(ms / state.track.duration) * el.scrollHeight}px)`;
    }
  }

  function fmt(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // ================= テーマ =================
  function setTheme(name) {
    if (!THEMES.includes(name)) name = 'glow';
    root.setAttribute('data-theme', name);
    store.set('lf_theme', name);
    document.querySelectorAll('.tp').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pick === name)));
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = name === 'bold' ? getComputedStyle(root).getPropertyValue('--solid').trim() || '#0b0b0f' : '#0b0b0f';
    // 並べ直す
    state.activeIndex = -1;
    state.kShown = [null, null];
    document.querySelectorAll('#karaoke .kline').forEach((r) => { r.style.fontSize = ''; });
  }
  function toggleThemePanel(open) {
    const panel = $('#themePanel');
    const show = open === undefined ? panel.hidden : open;
    panel.hidden = !show;
    $('#themeBtn').setAttribute('aria-expanded', String(show));
  }

  // ================= 操作系 =================
  function applyFontSize() {
    root.style.setProperty('--size', state.fontSize + 'px');
    store.set('lf_size', String(state.fontSize));
    state.activeIndex = -1; // 位置を再計算
    state.kShown = [null, null];
  }
  function changeFont(d) { state.fontSize = Math.max(16, Math.min(96, state.fontSize + d)); applyFontSize(); }

  function applyOffset() {
    const s = state.offsetMs / 1000;
    $('#offsetLabel').textContent = (s >= 0 ? '+' : '') + s.toFixed(2) + 's';
    store.set('lf_offset', String(state.offsetMs));
  }
  function changeOffset(d) { state.offsetMs += d; applyOffset(); }

  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }

  let wakeLock = null;
  async function keepAwake() {
    try { if ('wakeLock' in navigator && !wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch {}
    if (wakeLock) wakeLock.addEventListener('release', () => { wakeLock = null; }, { once: true });
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (!$('#themePanel').hidden) toggleThemePanel(false);
      document.body.classList.add('idle');
    }, 3000);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach((ev) => addEventListener(ev, wake, { passive: true }));

  $('#themeBtn').onclick = (e) => { e.stopPropagation(); toggleThemePanel(); };
  document.querySelectorAll('.tp').forEach((b) => { b.onclick = (e) => { e.stopPropagation(); setTheme(b.dataset.pick); }; });
  addEventListener('click', (e) => { if (!$('#themePanel').hidden && !e.target.closest('#themePanel')) toggleThemePanel(false); });
  $('#offMinus').onclick = () => changeOffset(-250);
  $('#offPlus').onclick = () => changeOffset(250);
  $('#smaller').onclick = () => changeFont(-4);
  $('#bigger').onclick = () => changeFont(4);
  $('#fs').onclick = toggleFullscreen;
  $('#logout').onclick = logout;
  $('#login').onclick = login;
  $('#clientId').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });

  addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 't' || e.key === 'T') setTheme(THEMES[(THEMES.indexOf(theme()) + 1) % THEMES.length]);
    else if (e.key === 'Escape') toggleThemePanel(false);
    else if (e.key === '+' || e.key === '=') changeFont(4);
    else if (e.key === '-') changeFont(-4);
    else if (e.key === '[') changeOffset(-250);
    else if (e.key === ']') changeOffset(250);
  });
  addEventListener('resize', () => { state.activeIndex = -1; state.kShown = [null, null]; });

  // ================= 起動 =================
  async function main() {
    setTheme(theme());
    applyFontSize();
    applyOffset();
    $('#redirectShow').textContent = REDIRECT_URI;
    $('#clientId').value = store.get('lf_client_id') || '';
    if (BUILTIN_CLIENT_ID) {
      $('#ownApp').hidden = true;
      store.set('lf_client_id', BUILTIN_CLIENT_ID);
    }

    try {
      await handleCallback();
    } catch (e) {
      $('#setupErr').textContent = e.message;
    }

    if (!store.get('lf_refresh')) {
      $('#setup').hidden = false;
      return;
    }
    showMessage('接続中…');
    keepAwake();
    wake();
    requestAnimationFrame(frame);
    poll();
  }
  main();
})();
</script>
<script src="/assets/analytics.js" defer></script>
<script src="/assets/maintenance.js" defer></script>
</body>
</html>
