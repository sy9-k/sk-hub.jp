    <section class="lang-screen band band--plain">
      <!-- アプリから開いたときだけ出す上の帯（戻るボタンと、開いていたアプリ。<html data-lang-app>） -->
      <div class="lang-appbar" data-lang-appbar>
        <a class="lang-appbar-back" href="/" data-lang-back aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M5 12l6-6M5 12l6 6"/></svg></a>
        <span class="lang-appbar-app"><img src="/assets/logo.svg" alt="" width="22" height="22" data-lang-app-icon><span data-lang-app-name>SK</span></span>
      </div>
      <div class="lang-card lang-card--loc" data-lang-card>
        <div class="loc-band"><h1 class="lang-title" data-lang-title>Choose your location</h1></div>
        <div class="loc-acc">
          <p class="loc-intro">Pick a region, then a language.</p>
          <div class="loc-cards" role="radiogroup" aria-label="Region">
            <button type="button" class="loc-card" role="radio" aria-checked="false" data-i18n-skip data-region="jp">
              <span class="loc-card-badge" aria-hidden="true">Current</span>
              <span class="loc-card-name">日本</span><span class="loc-card-sub">Japan</span>
              <span class="loc-card-desc">All SK products and support</span>
              <span class="loc-card-code" aria-hidden="true">JP</span>
            </button>
            <button type="button" class="loc-card" role="radio" aria-checked="false" data-i18n-skip data-region="kr">
              <span class="loc-card-badge" aria-hidden="true">Current</span>
              <span class="loc-card-name">한국</span><span class="loc-card-sub">Korea</span>
              <span class="loc-card-desc">Nagi, SK's Toolbox, SK Study, SK Hub Office</span>
              <span class="loc-card-code" aria-hidden="true">KR</span>
            </button>
            <button type="button" class="loc-card" role="radio" aria-checked="false" data-i18n-skip data-region="cn">
              <span class="loc-card-badge" aria-hidden="true">Current</span>
              <span class="loc-card-name">中国大陆</span><span class="loc-card-sub">China</span>
              <span class="loc-card-desc">Same as Japan, in Simplified Chinese</span>
              <span class="loc-card-code" aria-hidden="true">CN</span>
            </button>
            <button type="button" class="loc-card" role="radio" aria-checked="false" data-i18n-skip data-region="tw">
              <span class="loc-card-badge" aria-hidden="true">Current</span>
              <span class="loc-card-name">台灣・香港</span><span class="loc-card-sub">Taiwan and Hong Kong</span>
              <span class="loc-card-desc">Same as Japan, in Traditional Chinese</span>
              <span class="loc-card-code" aria-hidden="true">TW</span>
            </button>
            <button type="button" class="loc-card" role="radio" aria-checked="false" data-i18n-skip data-region="eu">
              <span class="loc-card-badge" aria-hidden="true">Current</span>
              <span class="loc-card-name">Europe</span><span class="loc-card-sub">EEA, UK, Switzerland</span>
              <span class="loc-card-desc">Same as Japan, in English, with GDPR information</span>
              <span class="loc-card-code" aria-hidden="true">EU</span>
            </button>
            <button type="button" class="loc-card" role="radio" aria-checked="false" data-i18n-skip data-region="global">
              <span class="loc-card-badge" aria-hidden="true">Current</span>
              <span class="loc-card-name">Other regions</span><span class="loc-card-sub">Everywhere else</span>
              <span class="loc-card-desc">Same as Japan, in English or Japanese</span>
              <span class="loc-card-code" aria-hidden="true">GL</span>
            </button>
          </div>
          <div class="loc-panel" data-panel="jp" hidden>
            <p class="loc-panel-label">Language</p>
            <div class="loc-chips">
              <button type="button" class="loc-link" data-i18n-skip data-region="jp" data-lang="ja" lang="ja"><span class="loc-link-name">日本語</span><span class="loc-link-hello">こんにちは</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="jp" data-lang="en" lang="en"><span class="loc-link-name">English</span><span class="loc-link-hello">Hello</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="jp" data-lang="ko" lang="ko"><span class="loc-link-name">한국어</span><span class="loc-link-hello">안녕하세요</span></button>
            </div>
          </div>
          <div class="loc-panel" data-panel="kr" hidden>
            <p class="loc-panel-label">Language</p>
            <div class="loc-chips">
              <button type="button" class="loc-link" data-i18n-skip data-region="kr" data-lang="ko" lang="ko"><span class="loc-link-name">한국어</span><span class="loc-link-hello">안녕하세요</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="kr" data-lang="en" lang="en"><span class="loc-link-name">English</span><span class="loc-link-hello">Hello</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="kr" data-lang="ja" lang="ja"><span class="loc-link-name">日本語</span><span class="loc-link-hello">こんにちは</span></button>
            </div>
          </div>
          <div class="loc-panel" data-panel="cn" hidden>
            <p class="loc-panel-label">Language</p>
            <div class="loc-chips">
              <button type="button" class="loc-link" data-i18n-skip data-region="cn" data-lang="zh-CN" lang="zh-CN"><span class="loc-link-name">简体中文</span><span class="loc-link-hello">你好</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="cn" data-lang="en" lang="en"><span class="loc-link-name">English</span><span class="loc-link-hello">Hello</span></button>
            </div>
          </div>
          <div class="loc-panel" data-panel="tw" hidden>
            <p class="loc-panel-label">Language</p>
            <div class="loc-chips">
              <button type="button" class="loc-link" data-i18n-skip data-region="tw" data-lang="zh-TW" lang="zh-TW"><span class="loc-link-name">繁體中文</span><span class="loc-link-hello">你好</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="tw" data-lang="en" lang="en"><span class="loc-link-name">English</span><span class="loc-link-hello">Hello</span></button>
            </div>
          </div>
          <div class="loc-panel" data-panel="eu" hidden>
            <p class="loc-panel-label">Language</p>
            <div class="loc-chips">
              <button type="button" class="loc-link" data-i18n-skip data-region="eu" data-lang="en" lang="en"><span class="loc-link-name">English</span><span class="loc-link-hello">Hello</span></button>
            </div>
          </div>
          <div class="loc-panel" data-panel="global" hidden>
            <p class="loc-panel-label">Language</p>
            <div class="loc-chips">
              <button type="button" class="loc-link" data-i18n-skip data-region="global" data-lang="en" lang="en"><span class="loc-link-name">English</span><span class="loc-link-hello">Hello</span></button>
              <button type="button" class="loc-link" data-i18n-skip data-region="global" data-lang="ja" lang="ja"><span class="loc-link-name">日本語</span><span class="loc-link-hello">こんにちは</span></button>
            </div>
          </div>
        </div>
        <p class="lang-note" data-lang-note>Applies to the SK website and all SK apps</p>
      </div>
      <!-- サイトから開いたときの「戻る」（アプリから開いたときは上の帯の戻るボタン） -->
      <a class="lang-cancel" href="/" data-lang-back>Back</a>
    </section>
