<title>SK's Toolbox（iOS の試作）</title>
<!--
  SK's Toolbox を iOS 26（Liquid Glass）のデザインで、電話のフレームなしの全画面アプリにした試作。配信しない（_ で始まるフォルダなので GitHub Pages には出ない）
  もとは _mockups/ui-compare/ の iOS（設定画面だけ）。それをホーム・アプリ・設定のタブと、7 つのアプリまで広げた。
  ・ホーム: ウィジェット（Clock・Countdown・Todo・Timetable・Memo）。「編集」で順番と表示を変えられる
  ・アプリ: アイコンの一覧。Todo の数のバッジ
  ・設定: テーマ・アプリの色・動きを減らす・通知・バックアップ（書き出し／読み込み）・言語・すべて消去
  ・Clock（世界時計・アラーム・ストップウォッチ・タイマー）／Calc（関数電卓つき）／Memo（画像も入る）／Todo／Countdown／Timetable／Roulette
  ・右下の丸から検索（アプリ・設定・Todo・メモ・Countdown・アラーム・授業）
  ・左のはしから右へスワイプで戻る。行を左へスワイプで削除
  本物の Toolbox とはデータを分けている（localStorage の sk_toolbox_ios）。同期はつながず、見た目だけ。
  アプリのアイコンは /toolbox/*/icon.svg を使う（読めないときは自作の線のアイコン）
  ガラスのレンズ（ふちで背景が曲がる）は Chromium だけ。ほかのブラウザはすりガラス
  ローカルで見る: python3 -m http.server 8765 → http://localhost:8765/_mockups/toolbox-ios/
-->

<style>
  /* ===== 色と大きさ（iOS のシステムカラーに近づける） ===== */
  :root {

    --lg-edge: rgba(0, 0, 0, .06);

    /* 横の余白（iPhone と同じく、狭い画面は 16、広い画面は 20） */

    --red: #ff4245; --orange: #ff9230; --yellow: #ffd600; --green: #30d158; --mint: #00dac3; --teal: #00d2e0; --cyan: #3cd3fe;
    --blue: #0091ff; --indigo: #6d7cff; --purple: #db34f2; --pink: #ff375f; --brown: #b78a66; --gray: #8e8e93;
    --accent: color-mix(in srgb, var(--sw) 70%, #fff);
    --sheet: rgba(28, 28, 30, .92); --sheet-list: #2c2c2e;
    --k-num: #333335; --k-fn: #5c5c5f; --k-fn2: rgba(120, 120, 128, .28);
    --lg-tint: rgba(40, 40, 44, .16); --lg-shadow: 0 8px 26px rgba(0, 0, 0, .55), 0 1px 3px rgba(0, 0, 0, .35);
    --lg-spec: rgba(255, 255, 255, .55); --lg-spec2: rgba(255, 255, 255, .2); --lg-glow: rgba(255, 255, 255, .28); --lg-rim: rgba(255, 255, 255, .6); --lg-rim2: rgba(255, 255, 255, .32);
    --lg-edge: rgba(255, 255, 255, .08);

  /* 動きを減らす */
  :root.reduce *, :root.reduce *::before, :root.reduce *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }

  * { box-sizing: border-box; }

    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  input, textarea, [contenteditable="true"], .cmain { -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; text-align: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  button:disabled { cursor: default; opacity: .4; }
  input, textarea, select { font: inherit; color: inherit; }
  h1, h2, h3, p, ul, ol { margin: 0; }
  ul, ol { padding: 0; list-style: none; }
  [hidden] { display: none !important; }
  .i { width: 24px; height: 24px; flex: none; display: block; }
  @media (min-width: 414px) { :root { --m: 20px; } }
  /* SF Pro に近づける: 字の詰め・大きさごとの字形（Inter の opsz） */
  body { font-optical-sizing: auto; letter-spacing: -.012em; font-feature-settings: "calt", "kern"; }
  .hero-title { letter-spacing: .004em; }
  ion-icon.i { --ionicon-stroke-width: 40px; }
  ion-icon.i > svg { display: block; width: 100%; height: 100%; }
  .ib ion-icon, .capsule ion-icon, .tb ion-icon { --ionicon-stroke-width: 48px; }

  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ===== 画面の重なり（タブの層の上に、開いた画面が右から重なる） ===== */
  .app { position: fixed; inset: 0; overflow: hidden; background: var(--bg); transition: background .25s; }
  .layer { position: absolute; inset: 0; z-index: 1; background: var(--bg); transition: transform .5s var(--ease); }
  .layer::after { content: ""; position: absolute; inset: 0; z-index: 60; background: #000; opacity: 0; pointer-events: none; transition: opacity .5s var(--ease); }
  .layer.under { transform: translateX(-28%); }

  /* ズームで開いたとき: うしろは少し小さく、暗く */

  .view { touch-action: pan-y; box-shadow: -10px 0 30px rgba(0, 0, 0, .08); }

  }

  /* ===== 上のバー（ガラスのボタンが浮かぶ。スクロールすると中身をぼかす） ===== */
  .bar {

  }
  .bar::before {
    content: ""; position: absolute; inset: 0 0 -28px; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .25s;
    background: linear-gradient(color-mix(in srgb, var(--bg) 62%, transparent) 20%, transparent);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    -webkit-mask-image: linear-gradient(#000 35%, transparent); mask-image: linear-gradient(#000 35%, transparent);
  }

  .bar-l, .bar-r { display: flex; align-items: center; gap: 8px; min-width: 0; }

  .is-scrolled > .scr > .bar .bar-title, .bar.always .bar-title { opacity: 1; }

  .ib { position: relative; display: grid; place-items: center; flex: none; width: 44px; height: 44px; border-radius: 50%; transition: transform .45s var(--spring); }
  .ib .i { width: 22px; height: 22px; stroke-width: 2.2; }

  .tb .i { width: 20px; height: 20px; stroke-width: 2.3; }

  .capsule .i { width: 22px; height: 22px; stroke-width: 2.1; }

  /* ===== Liquid Glass（ガラス）: 薄い色＋ふちのハイライト＋内側の光。Chromium では JS が SVG のレンズを足す ===== */
  /* 透明なガラス: 色はほとんど付けず、ぼかしも少し。厚みは「内側のふちの明るさ」と「落ちる影」で見せる */

  .row + .row::before, .swr + .swr::before, .row + .swr::before, .swr + .row::before { content: ""; position: absolute; z-index: 2; top: 0; left: 60px; right: 0; height: .5px; background: var(--line); }
  .list.ind0 > .row + .row::before, .list.ind0 > .swr + .swr::before, .list.ind0 > .swr + .row::before, .list.ind0 > .row + .swr::before { left: 16px; }
  .list.ind1 > .row + .row::before, .list.ind1 > .swr + .swr::before, .list.ind1 > .swr + .row::before, .list.ind1 > .row + .swr::before { left: 52px; }
  .row { transition: background .5s ease-out; }
  .row.hl { background: var(--press) !important; transition: none; }
  button.row[role="switch"]:active { background: var(--surface); }

  .in::placeholder { color: var(--sub); opacity: .8; }
  .in.r { text-align: right; }
  textarea.in { resize: none; min-height: 96px; line-height: 1.4; padding: 2px 0; }
  .pick { min-height: 34px; padding: 5px 11px; border: 0; border-radius: 9px; background: var(--fill); color: var(--ink); font-size: 17px; font-family: inherit; outline: none; }
  .pick:focus { color: var(--accent); }

  /* スワイプで出る操作（行を左へ） */
  .swr { position: relative; overflow: hidden; }

  .swb { flex: none; display: block; }

  .sw-k {

  [role="switch"][aria-checked="true"]:active .sw-k, [role="switch"][aria-checked="true"].pressing .sw-k { transform: translateX(24px) scale(1.4, 1.55); }

  /* 切りかえ（セグメント）: 選んだところの丸がばねで動き、押しているあいだはガラスになる */
  .seg { position: relative; display: flex; padding: 2px; border-radius: 999px; background: var(--fill); }

  .seg-ind.drag { transition: scale .3s var(--spring), background .2s, box-shadow .2s; }
  .seg:active .seg-ind, .seg.pressing .seg-ind {

    box-shadow: 0 6px 16px rgba(0, 0, 0, .14), inset 1px 1px 1px -.5px rgba(255, 255, 255, 1), inset -1px -1px 1px -.5px rgba(255, 255, 255, .6), inset 0 0 0 .6px rgba(255, 255, 255, .7);
  }

  .sws { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 12px; }
  .swt { position: relative; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--c) !important; transition: box-shadow .2s, transform .45s var(--spring); }
  .swt:active { transform: scale(1.15); }
  .swt[aria-checked="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--c); }
  .sheet .swt[aria-checked="true"] { box-shadow: 0 0 0 2px var(--sheet-list), 0 0 0 4px var(--c); }

  .foot { margin: 28px 32px 0; font-size: 12px; line-height: 1.6; color: var(--sub); }
  .empty { padding: 48px 32px 0; text-align: center; color: var(--sub); font-size: 15px; line-height: 1.6; }
  .empty b { display: block; margin-bottom: 4px; font-size: 20px; color: var(--ink); }

  /* アプリのアイコン（/toolbox/ の各アプリの icon.svg。読めないときは下の線のアイコン） */
  .aic { position: relative; display: grid; place-items: center; flex: none; width: var(--s, 30px); height: var(--s, 30px); border-radius: calc(var(--s, 30px) * .225); background: var(--tile); color: #fff; overflow: hidden; }
  .aic img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* iOS 26 のアイコンのつや（ふちのハイライト） */
  .aic::after {
    content: ""; position: absolute; inset: 0; z-index: 1; border-radius: inherit; pointer-events: none;
    background: linear-gradient(165deg, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0) 45%);
    box-shadow: inset 0 0 0 .5px rgba(255, 255, 255, .32), inset 0 -1px 1.5px rgba(0, 0, 0, .08);
  }
  .aic { transition: filter .35s; }

  /* ===== タブバー: 浮いたガラスのカプセル。下へスクロールすると、選んでいるタブだけの丸に縮む ===== */
  .edgeb {
    position: absolute; z-index: 14; left: 0; right: 0; bottom: 0; height: calc(var(--navb) + 110px); pointer-events: none;
    background: linear-gradient(transparent, color-mix(in srgb, var(--bg) 22%, transparent));
    backdrop-filter: blur(1.5px); -webkit-backdrop-filter: blur(1.5px);
    -webkit-mask-image: linear-gradient(transparent, #000 65%); mask-image: linear-gradient(transparent, #000 65%);
  }
  .dock { position: absolute; z-index: 15; left: 0; right: 0; bottom: calc(var(--navb) + var(--kb)); height: 62px; max-width: 520px; margin: 0 auto; pointer-events: none; transition: bottom .25s; }
  .nav { position: absolute; top: 0; bottom: 0; left: 20px; right: 92px; display: flex; padding: 4px; border-radius: 31px; pointer-events: auto; touch-action: none; transition: right .5s var(--spring), transform .55s var(--spring); }
  .nav.pressing { transform: scale(1.035); transition: right .5s var(--spring), transform .2s ease-out; }
  .nav-b.over { color: var(--accent); }
  .nav-pill.drag { transition: scale .35s var(--spring), background .25s, box-shadow .25s; }
  .dock.solo .nav { right: 20px; }
  .lg.nav { --lg-tint: rgba(255, 255, 255, .16); }
  .dark .lg.nav { --lg-tint: rgba(30, 30, 34, .26); }
  .nav-min .nav { right: calc(100% - 20px - 62px); }
  .nav-b { position: relative; z-index: 1; flex: 1 1 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; font-size: 10px; font-weight: 600; text-align: center; white-space: nowrap; transition: flex-grow .45s var(--spring), opacity .2s, color .2s; }
  .nav-b .i { width: 25px; height: 25px; stroke-width: 1.9; }
  .nav-b[aria-current="page"] { color: var(--accent); }
  .nav-l { transition: opacity .2s; }
  .nav-min .nav-b:not([aria-current]) { flex-grow: 0; opacity: 0; pointer-events: none; }
  .nav-min .nav-l { opacity: 0; height: 0; }
  .nav-pill { position: absolute; z-index: 3; top: 4px; bottom: 4px; left: 4px; width: 0; border-radius: 27px; pointer-events: none; background: var(--pill); transition: left .6s var(--spring), width .6s var(--spring), scale .35s var(--spring), background .25s, box-shadow .25s; }
  .nav-pill.is-moving {
    scale: 1.18 1.28; background: rgba(255, 255, 255, .08);
    box-shadow: 0 8px 20px rgba(0, 0, 0, .14), inset 1.5px 1.5px 1px -1px rgba(255, 255, 255, 1), inset -1px -1px 1px -.5px rgba(255, 255, 255, .7), inset 0 0 0 .6px rgba(255, 255, 255, .6), inset 0 0 12px rgba(255, 255, 255, .3);
  }
  .nav-badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff383c; color: #fff; font-size: 11px; font-weight: 700; line-height: 18px; }
  /* 検索の丸: 押すと横に伸びて、入力欄になる */
  .nav-search { position: absolute; top: 0; right: 20px; display: flex; align-items: center; width: 62px; height: 62px; border-radius: 31px; pointer-events: auto; transition: width .5s var(--spring); }
  .nav-search .sbtn { display: grid; place-items: center; flex: none; width: 62px; height: 62px; border-radius: 50%; transition: transform .45s var(--spring); }
  .nav-search .sbtn .i { width: 25px; height: 25px; stroke-width: 2; }
  .sin { display: none; flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font-size: 17px; color: var(--ink); }
  .sin::-webkit-search-cancel-button { display: none; }
  .sx { display: none; place-items: center; flex: none; width: 30px; height: 30px; margin-right: 14px; border-radius: 50%; background: var(--fill); color: var(--sub); }
  .sx .i { width: 14px; height: 14px; stroke-width: 3; }
  .searching .nav-search { width: calc(100% - 112px); }
  .searching .nav-search .sbtn { width: 50px; pointer-events: none; color: var(--sub); }
  .searching .sin { display: block; }
  .searching .sx { display: grid; }
  .srl { position: absolute; inset: 0; z-index: 12; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .searching .srl { opacity: 1; pointer-events: auto; }
  .srl mark { background: none; color: var(--accent); font-weight: 600; }

  /* 画面の下に浮くボタン（Memo・Todo） */
  .tbar { position: absolute; z-index: 15; left: 0; right: 0; bottom: calc(var(--navb) + var(--kb)); display: flex; align-items: center; justify-content: space-between; gap: 12px; max-width: 720px; margin: 0 auto; padding: 0 20px; pointer-events: none; transition: bottom .25s; }
  .tbar > * { pointer-events: auto; }
  .tbar .ib { width: 52px; height: 52px; }
  .tbar .tb { height: 52px; border-radius: 26px; }
  .tbar-t { pointer-events: none; font-size: 12px; color: var(--sub); }

  /* ===== お知らせ・確認ダイアログ・シート ===== */
  .toast { position: absolute; z-index: 95; top: calc(var(--sbh) + 8px); left: 50%; display: flex; align-items: center; gap: 8px; max-width: calc(100% - 48px); padding: 11px 18px; border-radius: 24px; transform: translateX(-50%); font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; translate: 0 -12px; scale: .9; transition: opacity .2s, translate .45s var(--spring), scale .45s var(--spring); }
  .lg.toast { --lg-tint: rgba(255, 255, 255, .55); }
  .dark .lg.toast { --lg-tint: rgba(36, 36, 38, .6); }
  .toast.is-on { opacity: 1; translate: 0 0; scale: 1; }
  .toast-ic { display: block; color: var(--on); }
  .toast-ic .i { width: 20px; height: 20px; stroke-width: 2.6; }
  .toast.warn .toast-ic { color: var(--orange); }

  .dlg-wrap { position: absolute; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(0, 0, 0, .18); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .dlg-wrap.is-on { opacity: 1; pointer-events: auto; }
  .dlg { position: relative; width: 300px; max-width: 100%; padding: 22px 16px 16px; border-radius: 34px; text-align: center; transform: scale(.86); transition: transform .5s var(--spring); }
  .is-on > .dlg { transform: none; }
  .lg.dlg { --lg-tint: rgba(255, 255, 255, .62); }
  .dark .lg.dlg { --lg-tint: rgba(36, 36, 38, .66); }
  .dlg-title { margin-bottom: 6px; font-size: 17px; font-weight: 600; line-height: 1.35; overflow-wrap: anywhere; }
  .dlg-msg { font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-line; }
  .dlg-msg:empty { display: none; }
  .dlg-acts { display: flex; gap: 10px; margin-top: 18px; }
  .dlg-acts.col { flex-direction: column; }
  .dbtn { flex: 1; min-height: 48px; padding: 0 12px; border-radius: 24px; background: var(--fill); font-size: 17px; font-weight: 500; text-align: center; transition: transform .45s var(--spring); }
  .dbtn--danger { color: var(--danger); font-weight: 600; }
  .dbtn--acc { background: var(--accent); color: #fff; font-weight: 600; }

  .sheet-wrap { position: absolute; inset: 0; z-index: 70; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0); transition: background .35s; }
  .sheet-wrap.is-on { background: rgba(0, 0, 0, .22); }
  .sheet {
    position: relative; display: flex; flex-direction: column; width: min(100% - 16px, 620px); max-height: calc(100% - var(--sbh) - 20px - var(--kb));
    margin-bottom: calc(8px + max(var(--sb) - 22px, 0px) + var(--kb)); border-radius: 38px; overflow: hidden;
    background: var(--sheet); backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
    box-shadow: 0 12px 40px rgba(0, 0, 0, .2), inset 1px 1px 1px -.5px var(--lg-spec2);
    transform: translateY(calc(100% + 40px)); transition: transform .5s var(--ease), margin-bottom .25s, max-height .25s;
  }
  .sheet-wrap.is-on > .sheet { transform: none; }
  .grabber { position: absolute; top: 6px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--fill); }
  .sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 16px 14px 6px; touch-action: none; cursor: grab; }
  .sheet-t { font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-b { overflow-y: auto; overscroll-behavior: contain; padding-bottom: 22px; scrollbar-width: none; }
  .sheet .grp { margin-top: 20px; }
  .sheet .grp:first-child { margin-top: 8px; }
  .sheet .list, .sheet .row { background: var(--sheet-list); }
  .days { display: flex; justify-content: space-between; gap: 6px; padding: 12px 16px; }
  .day { width: 38px; height: 38px; border-radius: 50%; background: var(--fill); font-size: 15px; font-weight: 600; transition: background .2s, color .2s, transform .45s var(--spring); }
  .day[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .stepper { display: flex; align-items: center; border-radius: 9px; background: var(--fill); }
  .stepper button { width: 46px; height: 32px; display: grid; place-items: center; }
  .stepper button + button { box-shadow: inset .5px 0 0 var(--line); }
  .stepper .i { width: 18px; height: 18px; stroke-width: 2.4; }

  /* ===== ホームのウィジェット ===== */
  .wgs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-flow: dense; gap: 14px; margin: 14px var(--m) 0; }
  @media (min-width: 700px) { .wgs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .wg { position: relative; display: flex; flex-direction: column; align-items: stretch; min-width: 0; padding: 14px 16px; border-radius: 26px; background: var(--surface); text-align: left; transition: transform .45s var(--spring); }
  .wg-s { aspect-ratio: 1; }
  .wg-w { grid-column: span 2; }
  .wg-h { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; font-size: 15px; font-weight: 600; }
  .wg-h .aic { --s: 22px; }
  .wg-h .row-chev { margin-left: auto; }
  .wg-meta { margin-left: auto; font-size: 13px; font-weight: 400; color: var(--sub); white-space: nowrap; }
  .wg-meta + .row-chev { margin-left: 0; }
  .wg-big { margin-top: auto; font-size: 46px; font-weight: 600; letter-spacing: -.02em; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .wg-sub { font-size: 13px; color: var(--sub); }
  .wg-foot { display: flex; align-items: center; gap: 4px; margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; overflow: hidden; }
  .wg-foot .i { width: 15px; height: 15px; stroke-width: 2.4; }
  .wg-cd { color: #fff; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 78%, #fff), var(--c)); }
  .wg-cd .wg-sub { color: rgba(255, 255, 255, .85); }
  .wg-cd-name { margin-top: auto; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wg-cd-n { display: flex; align-items: baseline; gap: 3px; font-size: 13px; font-weight: 600; }
  .wg-cd-n b { font-size: 44px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .wg-list { margin-top: 10px; }
  .wg-list > li { display: flex; align-items: center; gap: 10px; min-height: 38px; }
  .wg-list > li + li { border-top: .5px solid var(--line); }
  .wg-list .t { flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wg-list .d { flex: none; font-size: 13px; color: var(--sub); }
  .wg-list .d.red, .red { color: var(--danger); }
  .wg-add { display: flex; align-items: center; gap: 10px; margin-top: 6px; min-height: 40px; padding: 0 4px 0 12px; border-radius: 20px; background: var(--fill2); }
  .wg-add .i { width: 18px; height: 18px; color: var(--accent); stroke-width: 2.4; }
  .wg-add .in { font-size: 15px; }
  .wg-empty { padding: 14px 0 4px; font-size: 14px; color: var(--sub); }
  .wg-tt > li { gap: 12px; }
  .wg-tt .n { width: 18px; text-align: center; font-size: 13px; font-weight: 700; color: var(--sub); }
  .wg-tt .c { width: 4px; height: 22px; border-radius: 2px; background: var(--c, var(--fill)); }
  .wg-tt .now .t { font-weight: 700; color: var(--accent); }
  .wg-memo > li { cursor: pointer; }
  .wg-memo .t b { font-weight: 600; }
  .wg-btn { align-self: flex-start; margin-top: 10px; height: 34px; padding: 0 14px; border-radius: 17px; display: inline-flex; align-items: center; gap: 6px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 15px; font-weight: 600; transition: transform .45s var(--spring); }
  .wg-btn .i { width: 17px; height: 17px; stroke-width: 2.3; }
  .tck {
    position: relative; flex: none; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
    box-shadow: inset 0 0 0 1.6px color-mix(in srgb, var(--sub) 70%, transparent); transition: box-shadow .2s;
  }
  .tck::after { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); transform: scale(0); transition: transform .35s var(--spring); }
  .tck[aria-checked="true"] { box-shadow: inset 0 0 0 1.6px var(--accent); }
  .tck[aria-checked="true"]::after { transform: scale(1); }
  .tck.ghost { box-shadow: inset 0 0 0 1.6px var(--fill); }

  /* ===== アプリの一覧 ===== */
  .agrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 22px 8px; margin: 18px var(--m) 0; }
  @media (min-width: 600px) { .agrid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); } }
  .ap { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; transition: transform .45s var(--spring); }
  .ap-ic { position: relative; }
  .ap .aic { --s: 64px; box-shadow: 0 2px 6px rgba(0, 0, 0, .12); }
  .ap-n { max-width: 100%; font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .abadge { position: absolute; top: -6px; right: -6px; z-index: 1; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: #ff383c; color: #fff; font-size: 14px; font-weight: 600; line-height: 24px; text-align: center; }

  /* ===== 設定（もとの ui-compare の iOS） ===== */
  .acct { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin: 14px var(--m) 0; padding: 14px 16px; border-radius: 26px; background: var(--surface); }
  .av { display: grid; place-items: center; flex: none; width: 60px; height: 60px; border-radius: 50%; font-size: 24px; font-weight: 600; color: #fff; background: linear-gradient(#a8a8ad, #85858b); }
  .acct-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .acct-name { font-size: 20px; font-weight: 600; }
  .acct-sub { font-size: 13px; color: var(--sub); }
  .acct-actions { flex-basis: 100%; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 16px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); font-size: 15px; font-weight: 600; white-space: nowrap; transition: transform .45s var(--spring); }
  .btn .i { width: 18px; height: 18px; stroke-width: 2.2; }
  .btn.is-busy .i { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Clock ===== */
  .anlg { display: block; width: min(62vw, 250px); height: auto; margin: 18px auto 0; }
  .anlg .face { fill: var(--surface); }
  .anlg .tk { stroke: var(--sub); stroke-linecap: round; }
  .anlg .tk.b { stroke: var(--ink); }
  .anlg text { fill: var(--ink); font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; font-family: var(--font); }
  .anlg .hh, .anlg .mh { stroke: var(--ink); stroke-linecap: round; }
  .anlg .sh { stroke: var(--orange); stroke-linecap: round; }
  .anlg .dot { fill: var(--orange); }
  .dig { margin-top: 10px; text-align: center; font-size: 64px; font-weight: 300; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .dig small { font-size: 26px; color: var(--sub); }
  .dig-d { text-align: center; font-size: 15px; color: var(--sub); }
  .wc-t { font-size: 40px; font-weight: 300; font-variant-numeric: tabular-nums; }
  .alm { padding-top: 8px; padding-bottom: 8px; }
  .alm-t { font-size: 50px; font-weight: 300; line-height: 1.05; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .alm.off .alm-t, .alm.off .row-sub { color: var(--sub); }
  .alm-time { display: flex; justify-content: center; padding: 18px 16px; }
  .alm-time input { font-size: 44px; font-weight: 300; padding: 6px 18px; border-radius: 16px; font-variant-numeric: tabular-nums; }
  .stw { margin: 40px 0 6px; text-align: center; font-size: min(18vw, 86px); font-weight: 300; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .cbtns { display: flex; justify-content: space-between; max-width: 440px; margin: 24px auto 0; padding: 0 28px; }
  .cbtn { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 16px; font-weight: 500; background: var(--cb, var(--fill)); color: var(--cf, var(--ink)); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--cb, var(--fill)); transition: transform .45s var(--spring), filter .2s; }
  .cbtn:disabled { opacity: .45; }
  .cbtn.go { --cb: rgba(52, 199, 89, .22); --cf: #2fb350; }
  .cbtn.stop { --cb: rgba(255, 59, 48, .2); --cf: #ff383c; }
  .cbtn.pause { --cb: rgba(255, 149, 0, .22); --cf: #f08c00; }
  .dark .cbtn.go { --cf: #30d158; } .dark .cbtn.stop { --cf: #ff4245; } .dark .cbtn.pause { --cf: #ff9230; }
  .laps { margin: 28px var(--m) 0; }
  .laps .row { min-height: 46px; font-variant-numeric: tabular-nums; }
  .laps .row-val { color: inherit; }
  .lap-b { color: var(--on); } .lap-w { color: var(--danger); }
  .whls { position: relative; display: flex; justify-content: center; gap: 4px; height: 216px; margin: 24px 16px 0; }
  .whls::before { content: ""; position: absolute; left: 12px; right: 12px; top: 88px; height: 40px; border-radius: 10px; background: var(--fill); pointer-events: none; }
  @media (min-width: 520px) { .whls::before { left: calc(50% - 170px); right: calc(50% - 170px); } }
  .whl { position: relative; width: 104px; }
  .whl-s { height: 216px; padding: 88px 0; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain; -webkit-mask-image: linear-gradient(transparent, #000 38%, #000 62%, transparent); mask-image: linear-gradient(transparent, #000 38%, #000 62%, transparent); }
  .whl-s::-webkit-scrollbar { display: none; }
  .whl-i { display: block; width: 100%; height: 40px; padding-right: 50px; scroll-snap-align: center; text-align: right; font-size: 23px; line-height: 40px; font-variant-numeric: tabular-nums; }
  .whl-l { position: absolute; top: 88px; right: 6px; height: 40px; line-height: 40px; font-size: 15px; font-weight: 600; pointer-events: none; }
  .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 22px 16px 0; }
  .chip { height: 34px; padding: 0 14px; border-radius: 17px; background: var(--surface); font-size: 15px; font-weight: 500; transition: transform .45s var(--spring); }
  .tmr-ring { position: relative; width: min(74vw, 300px); aspect-ratio: 1; margin: 26px auto 0; }
  .tmr-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
  .tmr-ring circle { fill: none; stroke-width: 7; }
  .tmr-ring .tr { stroke: var(--fill); }

  .ckb { aspect-ratio: 1; border-radius: 999px; display: grid; place-items: center; background: var(--k-num); font-size: 34px; font-weight: 400; transition: filter .35s; box-shadow: 0 1px 2px rgba(0, 0, 0, .06); }

  :root:not(.dark) .ckb:active { filter: brightness(.86); }

  .mr .row-sub b { font-weight: 400; color: var(--ink); margin-right: 6px; }
  .mr-img { flex: none; width: 44px; height: 44px; border-radius: 9px; object-fit: cover; }
  .note-date { margin: 0 0 8px; text-align: center; font-size: 13px; color: var(--sub); }
  .note {
    min-height: calc(100dvh - var(--sbh) - 220px); padding: 0 max(var(--m), env(safe-area-inset-left)) 40px; outline: none;
    font-size: 17px; line-height: 1.5; overflow-wrap: anywhere; caret-color: var(--accent); -webkit-user-select: text; user-select: text;
  }

  .note img { display: block; max-width: 100%; height: auto; margin: 8px 0; border-radius: 14px; }

  /* ===== Todo ===== */
  .tcards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 12px var(--m) 0; }
  @media (min-width: 640px) { .tcards { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

  .ib, .tb, .capsule > button, .nav-search .sbtn, .rl-hub, .dbtn, .btn, .chip, .wg-btn, .cbtn, .day {

  // ===== Timetable =====

        (c ? '<section class="grp"><div class="list"><button type="button" class="row row--danger" data-del><span class="row-text"><span class="row-label">授業を消す</span></span></button></div></section>' : ""),

  function ttSettings() {

      title: "時間割の設定",

        '<div class="row"><span class="row-text"><span class="row-label">1 日の時間数</span></span><span class="row-val" data-cnt>' + tt.count + '</span><span class="stepper"><button type="button" data-step="-1" aria-label="減らす">' + ic("minus") + '</button><button type="button" data-step="1" aria-label="増やす">' + ic("plus") + "</button></span></div></div></section>" +
        '<section class="grp"><h2 class="grp-title">授業の時刻</h2><div class="list ind0" data-periods>' + periodsHTML() + "</div></section>" +
        '<section class="grp"><div class="list"><button type="button" class="row row--danger" data-clear><span class="row-text"><span class="row-label">時間割をすべて消す</span></span></button></div></section>',
      mount: function (b, api) {
        function readTimes() {
          $$("[data-ps]", b).forEach(function (x) { if (x.value) tt.periods[+x.dataset.ps][0] = (+x.value.split(":")[0]) + ":" + x.value.split(":")[1]; });

        }
        b.addEventListener("click", function (e) {
          var t = e.target.closest("button"); if (!t) return;
          if (t.hasAttribute("data-sat")) tt.sat = flip(t);
          if (t.dataset.step) { readTimes(); tt.count = Math.max(3, Math.min(8, tt.count + +t.dataset.step)); $("[data-cnt]", b).textContent = tt.count; $("[data-periods]", b).innerHTML = periodsHTML(); }

              if (!ok) return;
              for (var d = 1; d <= 6; d++) S.tt.days[d] = [null, null, null, null, null, null, null, null];
              for (var d2 = 1; d2 <= 6; d2++) tt.days[d2] = [null, null, null, null, null, null, null, null];

      done: function (b) { b._read(); tt.days = S.tt.days; S.tt = tt; changed(); }
    });
  }
  V.timetable = {
    title: "Timetable", large: true,
    mount: function (v) {
      var wd = new Date().getDay();
      v.day = ttDays().indexOf(wd) >= 0 ? wd : 1;
      v.el.addEventListener("click", function (e) {
        var t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.seg === "ttd") { v.day = ttDays()[segPick(t)]; V.timetable.list(v); return; }
        if (t.dataset.cell) { var p = t.dataset.cell.split(","); ttSheet(+p[0], +p[1]); return; }
        if (t.dataset.act === "view") { S.ttView = S.ttView === "day" ? "week" : "day"; save(); V.timetable.refresh(v); return; }
        if (t.dataset.act === "set") ttSettings();

    },
    refresh: function (v) {
      v.barR.innerHTML = '<span class="capsule lg"><button type="button" data-act="view" aria-label="' + (S.ttView === "day" ? "1 週間の表で見る" : "1 日ずつ見る") + '">' + ic(S.ttView === "day" ? "grid" : "list") + '</button><button type="button" data-act="set" aria-label="時間割の設定">' + ic("dots") + "</button></span>";

      } else {
        var wd = new Date().getDay(), h = '<div class="ttw" style="--d:' + days.length + '"><span></span>' + days.map(function (d) { return '<span class="ttw-h' + (d === wd ? " td" : "") + '">' + WD[d] + "</span>"; }).join("");
        var st = ttNow(wd);
        for (var p = 0; p < S.tt.count; p++) {
          h += '<span class="ttw-p">' + (p + 1) + "</span>";
          days.forEach(function (d) {
            var c = S.tt.days[d][p];
            h += '<button type="button" class="ttw-c' + (c ? "" : " empty") + (d === wd && p === st.now ? " now" : "") + '" data-cell="' + d + "," + p + '" style="--c:' + (c ? c.c : "#8e8e93") + '" aria-label="' + WD[d] + "曜日 " + (p + 1) + "時間目 " + (c ? esc(c.s) : "空き") + '">' + (c ? esc(c.s) + (c.r ? "<small>" + esc(c.r) + "</small>" : "") : "＋") + "</button>";
          });

        v.body.innerHTML = h + '</div><p class="grp-note" style="margin:12px 28px 0">マスを押すと、授業を入れたり変えたりできます。</p>';
      }
    },
    list: function (v) {
      var d = v.day, st = ttNow(d), h = "";
      for (var p = 0; p < S.tt.count; p++) {
        var c = S.tt.days[d][p], per = S.tt.periods[p];
        h += '<button type="button" class="row ttr' + (c ? "" : " empty") + (p === st.now ? " now" : "") + '" data-cell="' + d + "," + p + '"><span class="ttr-n"><b>' + (p + 1) + "</b><small>" + per[0] + "</small><small>" + per[1] + '</small></span><span class="ttr-c" style="--c:' + (c ? c.c : "var(--fill)") + '"></span>' +
          '<span class="row-text"><span class="row-label">' + (c ? esc(c.s) : "空き") + "</span>" + (c && c.r ? '<span class="row-sub">' + esc(c.r) + "</span>" : "") + "</span>" +

  // ===== Roulette =====
  var rlRedraw = null;
  var WHEEL_C = ["#ff383c", "#ff8d28", "#ffcc00", "#34c759", "#00c8b3", "#0088ff", "#6155f5", "#cb30e0", "#ff2d55", "#ac7f5e"];
  V.roulette = {
    title: "Roulette", large: true,
    mount: function (v) {
      v.rot = 0; v.spinning = false;
      V.roulette.render(v);
      v.el.addEventListener("click", function (e) {
        var t = e.target.closest("button");
        if (!t) return;
        if (t.dataset.act === "spin") V.roulette.spin(v);
        if (t.dataset.swa === "del") { var i = +t.dataset.i; S.roulette.items.splice(i, 1); closeSwr(); save(); V.roulette.render(v); }
        if (t.hasAttribute("data-rmwin")) { S.roulette.removeWin = flip(t); save(); }
        if (t.hasAttribute("data-hclear")) { S.roulette.history = []; save(); V.roulette.render(v); }
        if (t.hasAttribute("data-shuffle")) {
          var a = S.roulette.items;
          for (var k = a.length - 1; k > 0; k--) { var j = Math.floor(Math.random() * (k + 1)), x = a[k]; a[k] = a[j]; a[j] = x; }
          save(); V.roulette.render(v);
        }
      });
      v.el.addEventListener("submit", function (e) {
        e.preventDefault();
        var inp = $(".in", e.target), val = inp.value.trim();
        if (!val) return;
        if (S.roulette.items.length >= 24) { toast("項目は 24 個までです", true); return; }
        S.roulette.items.push(val); save(); v.refocus = true; V.roulette.render(v);
      });
      v.onResize = function () { V.roulette.draw(v); };
      window.addEventListener("resize", v.onResize);
      rlRedraw = function () { V.roulette.draw(v); };
    },
    unmount: function (v) { window.removeEventListener("resize", v.onResize); cancelAnimationFrame(v.raf); rlRedraw = null; },
    render: function (v) {
      var R = S.roulette, snap = flipSnap();
      v.body.innerHTML = '<div class="rl-stage"><span class="rl-ptr" aria-hidden="true"></span><canvas class="rl-wheel" role="img" aria-label="ルーレット"></canvas><button type="button" class="rl-hub lg" data-act="spin">回す</button></div>' +
        '<p class="rl-res" aria-live="polite">' + (v.last ? "<small>結果</small>" + esc(v.last) : "") + "</p>" +
        '<section class="grp"><h2 class="grp-title">項目（' + R.items.length + '）<button type="button" class="lnk" data-shuffle>並べかえ</button></h2><div class="list ind1">' + R.items.map(function (it, i) {
          return swipeRow('<div class="row swr-f"><span class="dotc" style="--c:' + WHEEL_C[i % WHEEL_C.length] + '"></span><span class="row-text"><span class="row-label">' + esc(it) + "</span></span></div>", swa("del", "削除", "trashF", 'data-i="' + i + '"'), "rl-" + it);
        }).join("") +
        '<form class="row" autocomplete="off"><span class="dotc" style="--c:var(--fill)"></span><input class="in" type="text" maxlength="30" placeholder="項目を追加" aria-label="項目を追加" enterkeyhint="done"></form></div><p class="grp-note">行を左へスワイプすると消せます。</p></section>' +
        '<section class="grp"><div class="list">' + '<div class="row"><span class="row-text"><span class="row-label">当たった項目を外す</span><span class="row-sub">同じものが 2 回出ないようにします</span></span>' + swHTML(R.removeWin, "data-rmwin", "当たった項目を外す") + "</div></div></section>" +
        (R.history.length ? '<section class="grp"><h2 class="grp-title">履歴<button type="button" class="lnk" data-hclear>消去</button></h2><div class="list ind0">' + R.history.slice(0, 10).map(function (h) {
          return '<div class="row"><span class="row-text"><span class="row-label">' + esc(h.v) + '</span></span><span class="row-val" style="font-size:15px">' + relTime(h.t) + "</span></div>";
        }).join("") + "</div></section>" : "");
      glassify(v.body);
      V.roulette.draw(v);
      flipPlay(snap);
      if (v.refocus) { v.refocus = false; $("form .in", v.body).focus(); }
    },
    draw: function (v) {
      var cv = $(".rl-wheel", v.body);
      if (!cv) return;
      var size = cv.clientWidth, dpr = window.devicePixelRatio || 1, items = S.roulette.items, n = items.length;
      if (!size) return;
      if (cv.width !== Math.round(size * dpr)) { cv.width = cv.height = Math.round(size * dpr); }
      var ctx = cv.getContext("2d"), r = size / 2, cs = getComputedStyle(document.documentElement);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, size, size);
      if (n < 1) { ctx.fillStyle = cs.getPropertyValue("--fill"); ctx.beginPath(); ctx.arc(r, r, r, 0, Math.PI * 2); ctx.fill(); return; }
      var seg = Math.PI * 2 / n;
      for (var i = 0; i < n; i++) {
        var a0 = v.rot + i * seg - Math.PI / 2;
        ctx.beginPath(); ctx.moveTo(r, r); ctx.arc(r, r, r, a0, a0 + seg); ctx.closePath();
        ctx.fillStyle = WHEEL_C[i % WHEEL_C.length]; ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.5; ctx.stroke();
        ctx.save();
        ctx.translate(r, r); ctx.rotate(a0 + seg / 2);
        ctx.fillStyle = "#fff"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
        var fs = Math.max(11, Math.min(18, size / 18, seg * r * .45));
        ctx.font = "700 " + fs + "px " + cs.getPropertyValue("--font");
        ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = 3;
        var label = items[i], maxW = r - 58;
        while (ctx.measureText(label).width > maxW && label.length > 1) label = label.slice(0, -1);
        if (label !== items[i]) label = label.slice(0, -1) + "…";
        ctx.fillText(label, r - 14, 0);
        ctx.restore();
      }
    },
    spin: function (v) {
      var items = S.roulette.items;
      if (v.spinning) return;
      if (items.length < 2) { toast("項目を 2 つ以上入れてください", true); return; }
      v.spinning = true;
      audio();
      var n = items.length, seg = Math.PI * 2 / n, start = v.rot;
      var target = start + Math.PI * 2 * (5 + Math.random() * 2) + Math.random() * Math.PI * 2;
      var dur = S.sw.motion ? 700 : 4200, t0 = performance.now(), lastIdx = -1;
      $(".rl-res", v.body).innerHTML = "";
      function idxAt(rot) { var a = ((-rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2); return Math.floor(a / seg) % n; }
      (function frame(now) {
        var p = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - p, 4);
        v.rot = start + (target - start) * e;
        V.roulette.draw(v);
        var ix = idxAt(v.rot);
        if (ix !== lastIdx) { if (lastIdx >= 0) { tick(); haptic(3); } lastIdx = ix; }
        if (p < 1) { v.raf = requestAnimationFrame(frame); return; }
        v.rot = v.rot % (Math.PI * 2);
        v.spinning = false;
        var win = items[ix];
        v.last = win;
        S.roulette.history.unshift({ v: win, t: Date.now() });
        S.roulette.history = S.roulette.history.slice(0, 30);
        beep(988, 0, .12, .2); beep(1319, .12, .3, .2); haptic([30, 40, 60]);
        var res = $(".rl-res", v.body);
        res.innerHTML = "<small>結果</small>" + esc(win);
        res.classList.remove("pop"); void res.offsetWidth; res.classList.add("pop");
        save();
        setTimeout(function () {
          if (!v.el.isConnected || v.spinning) return;
          if (S.roulette.removeWin && S.roulette.items.length > 1) { S.roulette.items.splice(ix, 1); save(); }
          var y = v.scr.scrollTop; V.roulette.render(v); v.scr.scrollTop = y;
        }, 1400);
      })(t0);
    }
  };

  // ===== キーボードが出たとき（iOS Safari）: 下に浮く部品を持ち上げる =====
  if (window.visualViewport) {
    var vvUpd = function () {
      var vv = window.visualViewport, kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty("--kb", (kb > 80 ? kb : 0) + "px");
    };
    visualViewport.addEventListener("resize", vvUpd);
    visualViewport.addEventListener("scroll", vvUpd);
  }

  // ===== 全体のキー操作 =====
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (dlgOpen.length) { dlgOpen[dlgOpen.length - 1].cancel(); return; }
      if (sheets.length) { sheets[sheets.length - 1].close(); return; }
      if (tabsEl.classList.contains("searching")) { closeSearch(); return; }
      if (stack.length && !(e.target.isContentEditable || /input|textarea/i.test(e.target.tagName))) back();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); while (stack.length) back(); openSearch(); }
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest('[data-act="back"]');
    if (b) back();
  });

  // ===== はじめ =====
  applyLook();
  renderSettings();
  renderHome();
  renderApps();
  updateBadges();
  setTab(S.tab);
  $$(".pane").forEach(bindScroll);
  bindScroll($(".srl"));
  glassify(document.body);
  requestAnimationFrame(function () { placePill(mainNav, true); });
  // URL の # でアプリを開く（例: #calc）
  var h = location.hash.slice(1);
  if (V[h] && h !== "note") setTimeout(function () { push(h); }, 50);
})();
